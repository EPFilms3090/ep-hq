<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>EP Films · Editing</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    color-scheme: dark;
    --ink:#F5F2EC; --cocoa:#D9CFC6; --muted:#B5ABA2; --taupe:#7D7168; --line:#3A3530; --ground:#121110; --card:#1E1C1A; --lane:#181715; --field:#272420;
    --ok-fg:#B7D6B1; --ok-bg:#1E2B1F; --ok-bd:#3E5A3B;
    --wait-fg:#CFC5BC; --wait-bg:#26231F; --wait-bd:#3F3A34;
    --due-fg:#F0CF85; --due-bg:#2E2616; --due-bd:#62501F;
    --bad-fg:#F4ADA4; --bad-bg:#3A1C19; --bad-bd:#73352E;
    --bar-done:#6E9B68; --bar-due:#C9A24E; --bar-late:#D0604F;
    --btn:#5A4A40; --btn-bd:#7A675A;
    --serif: Georgia, 'Times New Roman', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.4}
  .wrap{max-width:1400px;margin:0 auto;padding:16px}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  h1{font-family:var(--serif);font-weight:400;font-size:28px;margin:0;letter-spacing:.02em}
  .sub{color:var(--muted);font-size:13px}
  .found{border-left:3px solid var(--ok,#8CF5A8);background:rgba(140,245,168,.08);padding:8px 10px;margin:4px 0 10px;font-size:13px;word-break:break-word}
  .found-in{flex-basis:100%;color:#8CF5A8}
  .label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;text-align:left;font:inherit;color:inherit}
  .tile .n{font-family:var(--serif);font-size:30px;line-height:1.1}
  .tile.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
  .tile.bad .n{color:var(--bad-fg)}
  .loads{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:14px}
  .load{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
  .bar{height:8px;border-radius:4px;background:var(--wait-bg);overflow:hidden;display:flex;margin-top:6px}
  .bar i{display:block;height:100%}
  .tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  input[type=search],input[type=date],select,textarea{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--field);color:var(--ink)}
  input[type=search]{flex:1;min-width:180px}
  .chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink)}
  .chip.on{background:var(--btn);color:#fff;border-color:var(--btn-bd)}
  .board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(290px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
  .hscroll{position:sticky;top:0;z-index:5;background:var(--ground);display:flex;align-items:center;gap:8px;padding:8px 0;margin-bottom:6px}
  .hscroll.off{display:none}
  .track{flex:1;position:relative;height:18px;border-radius:9px;background:var(--lane);border:1px solid var(--line);cursor:pointer;touch-action:none}
  .thumb{position:absolute;top:2px;bottom:2px;left:0;min-width:40px;border-radius:7px;background:var(--btn-bd);cursor:grab}
  .thumb:hover,.thumb.drag{background:var(--muted)} .thumb.drag{cursor:grabbing}
  .board::-webkit-scrollbar{height:12px} .board::-webkit-scrollbar-track{background:var(--lane);border-radius:8px}
  .board::-webkit-scrollbar-thumb{background:var(--btn-bd);border-radius:8px;border:3px solid var(--lane)}
  .arrow{min-width:40px;font-size:15px;line-height:1}
  .lane{background:var(--lane);border:1px solid var(--line);border-radius:12px;padding:10px;scroll-snap-align:start;min-height:120px}
  .lane h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--cocoa);margin:2px 4px 10px;display:flex;justify-content:space-between}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;cursor:pointer}
  .card.late{border-left:4px solid var(--bar-late)}
  .couple{font-family:var(--serif);font-size:19px;line-height:1.2}
  .meta{color:var(--muted);font-size:12.5px;margin-top:2px}
  .steps{display:flex;gap:4px;margin:10px 0 8px}
  .steps span{flex:1;height:6px;border-radius:3px;background:var(--line)}
  .steps .done{background:var(--bar-done)} .steps .due{background:var(--bar-due)} .steps .late{background:var(--bar-late)} .steps .ok{background:var(--taupe)}
  .pills{display:flex;flex-wrap:wrap;gap:6px}
  .pill{font-size:12px;border-radius:6px;padding:3px 8px;border:1px solid}
  .s-done{color:var(--ok-fg);background:var(--ok-bg);border-color:var(--ok-bd)}
  .s-ok,.s-waiting,.s-upcoming{color:var(--wait-fg);background:var(--wait-bg);border-color:var(--wait-bd)}
  .s-due{color:var(--due-fg);background:var(--due-bg);border-color:var(--due-bd)}
  .s-late{color:var(--bad-fg);background:var(--bad-bg);border-color:var(--bad-bd)}
  .detail{border-top:1px solid var(--line);margin-top:10px;padding-top:10px;cursor:default}
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0}
  .row .name{min-width:96px;font-weight:600;font-size:13px}
  .btn{font:inherit;font-size:13px;border-radius:8px;padding:8px 12px;border:1px solid var(--btn-bd);background:var(--btn);color:#fff;cursor:pointer}
  .btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
  .btn.warn{background:#8C3A32;border-color:#8C3A32}
  .btn:disabled{opacity:.5;cursor:default}
  a.btn{text-decoration:none;display:inline-block}
  .empty{color:var(--muted);font-size:13px;padding:8px 4px}
  .warn-box{background:var(--bad-bg);color:var(--bad-fg);border:1px solid var(--bad-bd);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:13px}
  #toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#33302C;color:#fff;border:1px solid var(--line);padding:10px 16px;border-radius:10px;font-size:14px;display:none;max-width:90vw;z-index:9}
  #toast.bad{background:#8C3A32}
  .loading{opacity:.5;pointer-events:none}
  .ed-list .card{cursor:default}
  .big{font-size:15px;padding:12px 16px}
  .btn.small{font-size:12px;padding:5px 10px;margin-top:10px}
  .notes-box{border:1px solid var(--due-bd);background:var(--due-bg);color:var(--due-fg);border-radius:8px;padding:10px 12px;margin:8px 0;font-size:14px;white-space:pre-wrap}
  .notes-box b{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:4px}
  .rev-box{border-color:var(--bad-bd);background:var(--bad-bg);color:var(--bad-fg)}
  .chk{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
  .chk input{accent-color:#7A675A;width:16px;height:16px}
  .s-ready{color:#BFD3F0;background:#1B2533;border-color:#33496A}
  .notes-box .txt{max-height:6.2em;overflow:hidden}
  .notes-box.full .txt{max-height:none}
  .more{font:inherit;font-size:13px;background:none;border:0;color:inherit;text-decoration:underline;padding:6px 0 0;cursor:pointer}
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:8;padding:16px}
  #modal.on{display:flex}
  #modal .box{background:var(--card);border:1px solid var(--line);border-radius:12px;width:min(820px,100%);max-height:94vh;display:flex;flex-direction:column;gap:12px;padding:18px}
  #modal .head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  #modal textarea{width:100%;min-height:52vh;resize:vertical;font-size:16px;line-height:1.55}
  #modal .view{white-space:pre-wrap;overflow:auto;font-size:16px;line-height:1.6;min-height:20vh;padding:4px 2px}
  #modal select{align-self:flex-start}
  .btn:focus-visible,.chip:focus-visible,.more:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--due-fg);outline-offset:2px}
  .views{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-right:6px}
  .views button{font:inherit;font-size:13px;background:var(--card);color:var(--ink);border:0;padding:7px 14px;cursor:pointer}
  .views button.on{background:var(--btn);color:#fff}
  .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .acts a{font-size:13px;border-radius:8px;padding:7px 11px;border:1px solid var(--line);color:var(--ink);text-decoration:none;background:var(--field)}
  .acts a:hover{border-color:var(--muted)}
  .bride{cursor:default}
  .mtiles{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
  .mtiles .tile .n{font-size:28px}
  .tile .cmp{font-size:12px;color:var(--muted);margin:2px 0 6px;min-height:16px}
  .tile .cmp b{color:var(--ink);font-weight:600}
  .mchart{display:block;width:100%;height:auto;overflow:visible}
  .mchart text{font-family:var(--sans);font-size:14px;fill:var(--muted)}
  .mchart text.v{fill:var(--ink)}
  .urgent{display:block;width:100%;text-align:left;font:inherit;font-size:14px;cursor:pointer}
  .lane .lsub{font-size:12px;color:var(--muted);margin:-6px 4px 10px}
  @media (max-width:640px){ .wrap{padding:12px} h1{font-size:23px} .board{grid-auto-columns:88%;scroll-snap-type:x mandatory} .hscroll{display:none} }
  /* Editing board: 4 columns that always fit the screen (no sideways scrolling) */
  .board.four{grid-auto-flow:row;grid-template-columns:repeat(4,minmax(0,1fr));overflow:visible;scroll-snap-type:none;align-items:start}
  .board.four .lane{min-width:0}
  .ver{font-family:var(--sans);font-size:12px;letter-spacing:.08em;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px;vertical-align:middle}
  .lane.mine{border-color:var(--due-bd)}
  .lane.mine h2{color:var(--due-fg)}
  .lane .lsub{font-size:12px;color:var(--muted);margin:-6px 4px 10px}
  @media (max-width:1000px){ .board.four{grid-template-columns:repeat(2,minmax(0,1fr))} }
  @media (max-width:640px){ .board.four{grid-template-columns:minmax(0,1fr)} }
  details.donefold{margin:0 0 14px;background:var(--lane);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  details.donefold summary{cursor:pointer;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--cocoa)}
  details.donefold .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-top:10px}
  .tile.mine .n{color:var(--due-fg)}
  .pickup{border:1px solid var(--due-bd);background:var(--due-bg);border-radius:8px;padding:10px 12px;margin:4px 0 10px}
  .pickup .label{color:var(--due-fg);margin-top:0}
  .chap{font-family:var(--mono, ui-monospace, Menlo, Consolas, monospace);font-size:13px}
  .checklist{display:grid;gap:6px;margin:6px 0}
  .ck{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start;font-size:14px;line-height:1.45;padding:6px 8px;border:1px solid var(--bad-bd);border-radius:8px;background:var(--bad-bg);color:var(--bad-fg);cursor:pointer}
  .ck input{width:18px;height:18px;margin:1px 0 0;accent-color:#6E9B68;cursor:pointer}
  .ck.on{background:var(--ok-bg);border-color:var(--ok-bd);color:var(--ok-fg)}
  .ck.on span{text-decoration:line-through;opacity:.8}
  .ck.ro{cursor:default}
  #modal .checklist .ck{font-size:17px;padding:10px 12px}
  #modal .checklist{overflow:auto;max-height:70vh}
  /* ---------- one video type across all weddings (Teaser / Highlight / Documentary) ---------- */
  .vtabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
  .vtab{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;text-align:left;font:inherit;color:inherit;display:grid;gap:6px;min-width:0}
  .vtab.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
  .vtab .vname{font-family:var(--serif);font-size:21px;line-height:1.1}
  .vtab .vcount{display:flex;flex-wrap:wrap;gap:6px}
  .vtab .vcount b,.vsum button{font-weight:500;font-size:12px;border-radius:6px;padding:3px 8px;border:1px solid}
  .vtab b.l,.vsum .l{color:var(--bad-fg);background:var(--bad-bg);border-color:var(--bad-bd)}
  .vtab b.s,.vsum .s{color:var(--due-fg);background:var(--due-bg);border-color:var(--due-bd)}
  .vtab b.d,.vsum .d{color:var(--ok-fg);background:var(--ok-bg);border-color:var(--ok-bd)}
  .vtab b.z,.vsum .o{color:var(--wait-fg);background:var(--wait-bg);border-color:var(--wait-bd)}
  .vsum{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
  .vsum button{font-size:13px;padding:6px 12px;cursor:pointer;font-family:var(--sans)}
  .vsum button.on{box-shadow:0 0 0 2px var(--ink)}
  .vgroup{background:var(--lane);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}
  .vgroup h2,.vgroup summary{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--cocoa);margin:2px 2px 8px;font-weight:600;cursor:default}
  .vgroup summary{cursor:pointer;margin-bottom:0} .vgroup[open] summary{margin-bottom:8px}
  .vgroup.late{border-color:var(--bad-bd)} .vgroup.late h2{color:var(--bad-fg)}
  .vgroup.soon{border-color:var(--due-bd)} .vgroup.soon h2{color:var(--due-fg)}
  .vgroup.done summary{color:var(--ok-fg)}
  .vt{overflow-x:auto}
  .vt table{border-collapse:collapse;width:100%;min-width:720px;font-size:14px;table-layout:fixed}
  .vt th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);font-weight:500;white-space:nowrap}
  .vt td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
  .vt tr:last-child td{border-bottom:0}
  .vt tbody tr{cursor:pointer} .vt tbody tr:hover td{background:var(--card)}
  .vt .cp{font-family:var(--serif);font-size:16px} .vt .mt{color:var(--muted);font-size:12px}
  .wk{display:inline-block;min-width:64px;text-align:center;font-size:12.5px;font-weight:600;border-radius:999px;padding:3px 10px;border:1px solid}
  .wk.late{color:var(--bad-fg);background:var(--bad-bg);border-color:var(--bad-bd)}
  .wk.soon{color:var(--due-fg);background:var(--due-bg);border-color:var(--due-bd)}
  .wk.ok{color:var(--wait-fg);background:var(--wait-bg);border-color:var(--wait-bd)}
  .wk.done{color:var(--ok-fg);background:var(--ok-bg);border-color:var(--ok-bd)}
  .vt .st{font-weight:600} .vt .st.late{color:var(--bad-fg)} .vt .st.soon{color:var(--due-fg)} .vt .st.done{color:var(--ok-fg)}
  .vt .xtra{color:var(--muted);font-size:12.5px}
  select.ask{border-color:var(--due-bd);color:var(--due-fg)}
  @media (max-width:640px){
    .vtabs{grid-template-columns:minmax(0,1fr)}
    .vt table{min-width:0;table-layout:auto} .vt colgroup,.vt thead{display:none} .vt table,.vt tbody{display:block}
    .vt tbody tr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:10px 2px;border-bottom:1px solid var(--line)}
    .vt tbody tr:last-child{border-bottom:0}
    .vt td{display:block;padding:0;border:0}
    .vt td:nth-child(2){grid-column:2;grid-row:1;text-align:right}
    .vt td:nth-child(3),.vt td:nth-child(4){font-size:12.5px;color:var(--muted)}
    .vt td:nth-child(3)::before{content:'Editor: '} .vt td:nth-child(4){text-align:right} .vt td:nth-child(4)::before{content:'Due '}
    .vt td:nth-child(5){grid-column:1 / -1}
  }
  /* ---------- Marketing (Rafael only) ---------- */
  .mk{--c-new:#8EC5FF;--c-call:#B9A6FF;--c-sent:#F0CF85;--c-signed:#F5A97F;--c-booked:#8CF5A8;--up:#8CF5A8;--down:#FF9A8B;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
  .mk .sec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-width:0}
  .mk>*,.mk .grid2>*{min-width:0}
  .mk .ctl .sub{flex:1 1 220px;min-width:0}
  .mk .sec h2{font-family:var(--serif);font-weight:400;font-size:21px;margin:0 0 2px}
  .mk .sec .lede{color:var(--muted);font-size:13px;margin:0 0 12px}
  .mk .ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .mk .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:12px}
  .mk .kpi{background:var(--lane);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:12px;padding:12px 14px;display:grid;gap:6px;min-width:0}
  .mk .kpi .k{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .mk .kpi .v{font-family:var(--serif);font-size:40px;line-height:1;color:var(--c)}
  .mk .chips{display:flex;flex-wrap:wrap;gap:6px}
  .mk .dl{font-size:12px;border-radius:999px;padding:3px 8px;background:var(--field);color:var(--muted);white-space:nowrap}
  .mk .dl.up{color:var(--up);background:rgba(140,245,168,.10)} .mk .dl.down{color:var(--down);background:rgba(255,154,139,.10)}
  .mk .dl b{font-weight:600}
  .mk svg{display:block;width:100%;height:auto;overflow:visible}
  .mk svg text{font-family:var(--sans);fill:var(--muted);font-size:12px}
  .mk svg text.v{fill:var(--ink);font-weight:600}
  .mk svg text.big{font-size:15px}
  .mk .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:16px}
  .mk .grid2.wide{grid-template-columns:minmax(0,4fr) minmax(0,7fr)}
  @media (max-width:1100px){ .mk .grid2.wide{grid-template-columns:minmax(0,1fr)} }
  .mk .tbl.fit table{min-width:0;font-size:13px} .mk .tbl.fit th,.mk .tbl.fit td{padding:8px 7px}
  .mk .tbl.fit th{letter-spacing:.04em;white-space:normal;vertical-align:bottom;line-height:1.25}
  .mk .tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
  .mk table{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
  .mk th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:right;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-weight:500;background:var(--lane)}
  .mk th:first-child,.mk td:first-child{text-align:left}
  .mk td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .mk tr:last-child td{border-bottom:0}
  .mk td .sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;vertical-align:-1px;background:var(--c)}
  .mk td.up{color:var(--up)} .mk td.down{color:var(--down)} .mk td.dim,.mk span.dim{color:var(--muted)}
  .mk tr.grp td{background:var(--lane);color:var(--muted);font-size:11px;letter-spacing:.1em;text-transform:uppercase;text-align:left}
  .mk tr.sel td{background:rgba(245,242,236,.06)}
  .mk .heat{border-radius:6px;padding:2px 6px}
  .mk .legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted);margin:2px 0 10px}
  .mk .legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-2px}
  .mk .note{color:var(--muted);font-size:12.5px}
  .mk .warn-box{margin:0}
  .mk .tag{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#0E1A10;background:var(--c-booked);border-radius:999px;padding:2px 8px;margin-left:8px;vertical-align:3px}
  .mk h2.mkh{font-family:var(--serif);font-weight:400;font-size:26px;margin:10px 0 -4px}
  .mk .season{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
  .mk .season span{font-size:13px;border-radius:999px;padding:4px 10px;background:var(--field)}
  .mk .season .pk{color:var(--up);background:rgba(140,245,168,.10)} .mk .season .sl{color:var(--down);background:rgba(255,154,139,.10)}
  .mk .mklist{margin:10px 0 0;padding-left:18px;font-size:13.5px;line-height:1.6} .mk .mklist .dim{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="sub">Loading…</p></div>
<div id="modal" onclick="if(event.target===this&&M&&M.mode==='view')closeModal()"></div>
<div id="toast"></div>
<script>window.EP_API="https://script.google.com/macros/s/AKfycbxjnfOSfxHyKDTHs1bEDh1jUUHruvAzmZEjYDTtr_6uwKSwm3DveB2-LFidnfmbZrOm2A/exec";</script>
<script>
var BOOT = null;
try { BOOT = JSON.parse(document.getElementById('boot').textContent); } catch (e) { BOOT = null; }
/* Two ways in: inside Google (google.script.run) or from the GitHub page (plain web requests, no Google login needed). */
var API = window.EP_API || '';
if (!BOOT && API) { var qk = (location.search.match(/[?&]k=([a-z0-9]{20})/) || [])[1]; if (qk) BOOT = { k: qk }; }
function server(fn, args, ok, fail){
  if (!API) { var r = google.script.run.withSuccessHandler(ok).withFailureHandler(fail); r[fn].apply(r, args); return; }
  var req = fn === 'ccAct'
    ? fetch(API, { method:'POST', credentials:'omit', redirect:'follow', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({ fn:'act', args:args }) })
    : fetchWithTimeout(API + '?api=' + (fn === 'ccLoad' ? 'load' : fn === 'ccMarketing' ? 'mkt' : 'version') + '&k=' + encodeURIComponent(args[0]), fn === 'ccMarketing' ? 40000 : 15000);
  req.then(function(res){ if (!res.ok) throw new Error('The server did not answer (' + res.status + '). Please try again in a moment.'); return res.json(); })
     .then(function(j){ if (j && j.error) fail(new Error(j.error)); else ok(j.result); })
     .catch(function(e){ if (e && e.name === 'AbortError') { var t = new Error('Google is taking too long to answer.'); t.timeout = true; return fail(t); }
       fail(new Error(/fetch|network|load failed/i.test(String(e && e.message)) ? 'Could not reach the server. Check your internet and try again.' : String((e && e.message) || e))); });
}
function fetchWithTimeout(url, ms){
  if (!window.AbortController) return fetch(url, { credentials:'omit', redirect:'follow' });
  var c = new AbortController(), t = setTimeout(function(){ c.abort(); }, ms);
  return fetch(url, { credentials:'omit', redirect:'follow', signal:c.signal }).then(function(r){ clearTimeout(t); return r; }, function(e){ clearTimeout(t); throw e; });
}
/* the last board this browser saw, so the page opens instantly while fresh data loads */
function cacheKey(){ return 'ep_board_' + (BOOT && BOOT.k || ''); }
function saveCopy(d){ try { localStorage.setItem(cacheKey(), JSON.stringify({ t: Date.now(), d: d })); } catch (e) {} }
function readCopy(){ try { var x = JSON.parse(localStorage.getItem(cacheKey()) || 'null'); return x && x.d && (Date.now() - x.t) < 7*864e5 ? x : null; } catch (e) { return null; } }
var CONNECTED = !!BOOT && (!!API || !!(window.google && google.script));
var S = { data:null, open:{}, q:'', filter:'all', confirm:'', view:'edit', bq:'', bfilter:'all', bmonth:'cur' };
try { var hv = location.hash==='#brides' ? 'brides' : location.hash==='#marketing' ? 'mkt' : '', lv = localStorage.getItem('ep_view'); S.view = hv || (lv==='brides'||lv==='mkt' ? lv : 'edit'); } catch (e) {}
/* 4 columns, left to right the way a wedding moves. "Your turn" = Rafael: pick up delivered videos and upload them to
   MediaZilla, and do revisions. Maga sends only what is already on MediaZilla. Closed weddings fold away under the board. */
var LANES = [['start','Coming up & footage'], ['editors','With editors'], ['mine','Your turn'], ['maga','Maga sends']];
/* each video sits in its own column, so one wedding can show in two or three columns at once */
function lanesOf(c){ return c.lanes||['start']; }
function onLane(c,l){ return lanesOf(c).indexOf(l)>=0; }
function laneName(l){ var a=S.data&&S.data.role==='Assistant'; return l==='mine'?(a?'With Rafael':'Your turn'):l==='maga'?(a?'Ready to send':'Maga sends'):LANES.filter(function(x){return x[0]===l;})[0][1]; }
var EDS = ['Betania','Sanjay','Gilberth'];
var SENDS = { teaser:['Teaser','Teaser sent to the couple'], hl:['Highlight','Highlight sent to the couple'], doc:['Documentary','Documentary sent to the couple'], cer:['Ceremony','Ceremony sent to the couple'] };
function vName(c,t){ var v=(c.videos||[]).filter(function(x){return x.type===t;})[0]; return v?v.label:SENDS[t][0]; }
/* Who edits each video — picked by hand (Maga or Rafael): Betania, Sanjay, Gilberth, or "Do not have this video" */
var VTYPES=[['teaser','Teaser'],['hl','Highlight'],['doc','Documentary']];
function assignBox(c,K){
  var a=c.assign||{}, h='<div class="label" style="margin-top:4px">Editors — who edits each video</div>';
  VTYPES.concat(c.silver?[['cer','Ceremony']]:[]).forEach(function(x){      // Ceremony: Silver weddings only
    var t=x[0], cur=a[t]||'', v=(c.videos||[]).filter(function(y){return y.type===t;})[0], locked=!!(v&&v.done);
    h+='<div class="row"><span class="name">'+x[1]+'</span><select aria-label="'+x[1]+' editor"'+(locked?' disabled':'')+(cur?'':' class="ask"')+
      ' onchange="if(this.value)act(\'assign\','+K+',\''+t+'\',\'\',this.value)">'+
      (cur?'':'<option value="" selected>Choose…</option>')+
      EDS.concat(['None']).map(function(e){ return '<option value="'+e+'"'+(cur===e?' selected':'')+'>'+(e==='None'?'Do not have this video':e)+'</option>'; }).join('')+
      '</select>'+(locked?'<span class="sub">delivered '+esc(v.done)+'</span>':'')+'</div>';
  });
  return h;
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function toast(msg,bad){ var t=document.getElementById('toast'); t.textContent=msg; t.className=bad?'bad':''; t.style.display='block'; clearTimeout(toast.h); toast.h=setTimeout(function(){t.style.display='none';},msg.length>60?8000:4500); }
function todayIso(){ var p=S.data.today.split('/'); return p[2]+'-'+p[0]+'-'+p[1]; }
function busy(on){ document.getElementById('app').classList.toggle('loading',!!on); }

/* Opening the page: show the last saved copy at once (if this browser has one), then fetch fresh data.
   If Google is slow, try again by itself (3 times), and never sit on "Loading…" in silence. */
var loadTry=0;
function load(){
  var my=++loadTry, app=document.getElementById('app'), attempt=0;
  if(!S.data){ var copy=readCopy(); if(copy){ S.data=copy.d; S.version=''; S.stale=true; render();
    toast('Showing your board from '+new Date(copy.t).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})+' · updating…'); } }
  if(!S.stale) busy(true);
  var slow=setTimeout(function(){
    if(my!==loadTry || S.data) return;
    busy(false);
    app.innerHTML='<div class="warn-box">Still loading your weddings… Google is slow right now; the page keeps trying by itself. '+
      'You can wait, or <button class="btn" onclick="load()">Try again</button></div>';
  },20000);
  function go(){
    attempt++;
    server('ccLoad',[BOOT.k],function(d){
      if(my!==loadTry) return;
      clearTimeout(slow); var was=S.data, wasStale=S.stale;
      S.data=d; S.version=d.version; S.lastFull=Date.now(); S.stale=false; busy(false); saveCopy(d);
      if(wasStale){ var lanes=document.getElementById('lanes'), x=lanes?lanes.scrollLeft:0, y=window.scrollY; render(); lanes=document.getElementById('lanes'); if(lanes) lanes.scrollLeft=x; window.scrollTo(0,y); toast(changes(was,d)||'Up to date'); }
      else render();
    },function(e){
      if(my!==loadTry) return;
      if(e.timeout && attempt<3) return go();                 // Google was slow: ask again
      clearTimeout(slow); busy(false);
      if(S.data){ toast((S.stale?'Could not update the board: ':'')+(e.message||String(e)),true); return; }
      app.innerHTML='<div class="warn-box">'+esc(e.message||e)+' <button class="btn" onclick="load()">Try again</button></div>';
    });
  }
  go();
}
function act(a,key,video,date,value){
  busy(true);
  server('ccAct',[BOOT.k,a,key,video||'',date||'',value===undefined?'':value],
    function(d){ S.data=d; S.version=d.version; S.lastFull=Date.now(); S.confirm=''; S.stale=false; saveCopy(d); busy(false); render(); toast(d.note||'Saved'); },
    function(e){ busy(false); toast(e.message||String(e),true); });
}
/* two taps for anything that is hard to undo */
function twice(id,fn){ if(S.confirm===id){ S.confirm=''; fn(); } else { S.confirm=id; render(); toast('Tap again to confirm'); } }

function pill(v,showEd){
  if(showEd && v.sent) return '<span class="pill s-done">'+esc(v.label+' · sent to the couple '+v.sent)+'</span>';
  var txt = v.label + (showEd? ' · '+(v.editor==='ASK'?'choose editor':v.editor):'') +
    (v.done? ' · delivered '+v.done+(showEd&&v.rev?' · revised '+v.rev+'x':'')+(showEd&&v.pickup?' · pick up':'') : (v.status==='waiting'?'':(showEd&&v.given===''?' · not handed over yet':'')+' · due '+v.due));
  return '<span class="pill s-'+esc(showEd&&v.pickup?'due':v.status)+'">'+esc(txt)+'</span>';
}

/* ---------------------------------------------------- pop-up for long notes */
var M=null, MAXN=5000;
function cardBy(key){ return S.data.cards.filter(function(x){return x.key===key;})[0]; }
function isLong(t){ t=String(t||''); return t.length>240 || t.split('\n').length>4; }
function noteBox(title,text,cls,opener){
  return '<div class="notes-box '+(cls||'')+'">'+(title?'<b>'+esc(title)+'</b>':'')+'<div class="txt">'+esc(text)+'</div>'+
    (isLong(text)?'<button class="more" onclick="'+opener+'">Read all</button>':'')+'</div>';
}
function viewNote(key,field,title){
  var c=cardBy(key); if(!c) return;
  openModal({mode:'view', title:title, sub:c.couple+' · '+c.date, text:c[field]||''});
}
function editNote(key,action){
  var c=cardBy(key); if(!c) return;
  var en=action==='enotes';
  openModal({mode:'edit', title:en?'Notes for editors':'Internal notes', sub:c.couple+' · '+c.date+(en?' · the editors see this':' · editors never see this'),
    text:en?c.editorNotes:c.notes, placeholder:en?'Special requests from the client: songs, moments, people to feature, things to avoid…':'Anything you want to remember about this wedding',
    saveLabel:'Save notes', onSave:function(t){ act(action,key,'','',t); }});
}
function askRevision(key){
  var c=cardBy(key); if(!c) return;
  var sent=c.videos.filter(function(v){return v.done;});
  openModal({mode:'edit', title:'Client asked for changes', sub:c.couple+' · '+c.date+' · goes to Rafael, the editor is not told',
    choices:sent.map(function(v){return [v.type,v.label];}), text:'', required:true,
    placeholder:'Write exactly what the client wants changed, one change per line — Rafael gets each line as a box to tick off',
    saveLabel:'Send to Rafael for revision', onSave:function(t,p){ act('revision',key,p,'',t); }});
}
function openModal(o){
  M=o; var m=document.getElementById('modal');
  var h='<div class="box" role="dialog" aria-modal="true" aria-labelledby="m-title"><div class="head"><div><div class="couple" id="m-title">'+esc(o.title)+'</div>'+
    (o.sub?'<div class="sub">'+esc(o.sub)+'</div>':'')+'</div><button class="btn ghost" onclick="closeModal()">Close</button></div>';
  if(o.mode==='view') h+='<div class="view">'+esc(o.text)+'</div>';
  else if(o.mode==='check') h+=revChecklist(cardBy(o.key),S.data.isAdmin,true);
  else {
    if(o.choices) h+='<label class="label" for="m-pick">Which video</label><select id="m-pick">'+o.choices.map(function(x){return '<option value="'+esc(x[0])+'">'+esc(x[1])+'</option>';}).join('')+'</select>';
    h+='<label class="label" for="m-text">'+(o.label||(o.choices?'What to change':'Notes'))+'</label>'+
      '<textarea id="m-text" maxlength="'+MAXN+'" placeholder="'+esc(o.placeholder||'')+'">'+esc(o.text||'')+'</textarea>'+
      '<div class="row" style="justify-content:flex-end;margin:0"><span class="sub" id="m-count" style="margin-right:auto"></span>'+
      '<button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveModal()">'+esc(o.saveLabel||'Save')+'</button></div>';
  }
  m.innerHTML=h+'</div>'; m.className='on'; document.body.style.overflow='hidden';
  var t=document.getElementById('m-text');
  if(t){ t.oninput=countModal; countModal(); t.focus(); t.setSelectionRange(t.value.length,t.value.length); }
  else m.querySelector('button').focus();
}
function countModal(){ var t=document.getElementById('m-text'), n=document.getElementById('m-count'); if(t&&n) n.textContent=t.value.length+' / '+MAXN+' characters'; }
function modalChanged(){ var t=document.getElementById('m-text'); return !!(t && t.value!==(M.text||'')); }
function closeModal(){
  if(!M) return;
  var wasCheck=M.mode==='check';
  M=null; var m=document.getElementById('modal'); m.className=''; m.innerHTML=''; document.body.style.overflow='';
  if(wasCheck && document.getElementById('lanes')) renderLanes();
}
function saveModal(){
  var t=val('m-text'), p=val('m-pick');
  if(M.required && !t.trim()){ toast('Write what the client wants changed first',true); return; }
  var fn=M.onSave; closeModal(); fn(t,p);
}
document.addEventListener('keydown',function(e){
  if(e.key!=='Escape'||!M) return;
  if(modalChanged()) toast('You have unsaved text — press Cancel to throw it away, or Save');
  else closeModal();
});
function steps(c){
  var s=[c.footageStatus==='upcoming'?'ok':c.footageStatus];
  c.videos.forEach(function(v){ s.push(v.status==='waiting'?'':v.status); });
  c.videos.forEach(function(v){ s.push(v.sent?'done':''); });
  s.push(c.closed?'done':'');
  return '<div class="steps" title="Footage → videos → sent">'+s.map(function(x){return '<span class="'+x+'"></span>';}).join('')+'</div>';
}

/* ---------------------------------------------------- Rafael & assistant */
function renderBoard(){
  var d=S.data, cards=d.cards;
  function count(st){ return cards.filter(function(c){return c.stage===st;}).length; }
  var late=cards.filter(function(c){return c.late && c.stage!=='closed';}).length;
  var h='<header><div><h1>Editing <span class="ver">v1.2</span></h1><div class="sub">'+esc(d.role)+' · today '+esc(d.today)+' · weddings from '+esc(d.trackFrom)+'</div></div>'+
    '<div class="row" style="margin:0">'+viewSwitch()+(d.links&&d.links.Assistant?'<button class="chip" onclick="copyLink(\'Assistant\')">Copy Maga’s link</button>':'')+
    '<button class="chip" onclick="load()">Refresh</button></div></header>';
  (d.warnings||[]).forEach(function(w){ h+='<div class="warn-box">'+esc(w)+'</div>'; });
  function lc(l){ return cards.filter(function(c){return onLane(c,l);}).length; }
  var mineN=lc('mine');
  h+='<div class="tiles">'+
    tile('st:upcoming','Coming up',count('upcoming'))+tile('st:footage','Footage & hand-over',count('footage')+count('assign'))+tile('lane:editors','With editors',lc('editors'))+
    tile('lane:mine',laneName('mine'),mineN,false,mineN>0)+tile('lane:maga',laneName('maga'),lc('maga'))+
    tile('late','Late',late,late>0)+'</div>';
  h+='<div class="loads">'+EDS.map(function(e){
    var open=[],lt=0,due=0;
    cards.forEach(function(c){ if(!c.footage) return; c.videos.forEach(function(v){ if(v.editor===e && !v.done){ open.push(v); if(v.status==='late')lt++; else if(v.status==='due')due++; } }); });
    var n=open.length, w=function(x){return n?(x/n*100)+'%':'0';};
    return '<div class="load"><div style="display:flex;justify-content:space-between"><b>'+e+'</b><span class="sub">'+n+' open · '+lt+' late</span></div>'+
      '<div class="bar"><i style="width:'+w(lt)+';background:var(--bar-late)"></i><i style="width:'+w(due)+';background:var(--bar-due)"></i><i style="width:'+w(n-lt-due)+';background:var(--taupe)"></i></div>'+
      (d.links&&d.links[e]?'<button class="btn ghost small" onclick="copyLink(\''+e+'\')">Copy '+e+'’s link</button>':'')+'</div>';
  }).join('')+'</div>';
  h+=vtButtons();
  h+='<div class="tools"><input type="search" placeholder="Search a couple" value="'+esc(S.q)+'" oninput="S.q=this.value;renderLanes()">'+
    ['all','late'].concat(EDS).map(function(f){return '<button class="chip'+(S.filter===f?' on':'')+'" onclick="setFilter(\''+f+'\')">'+(f==='all'?'All':f==='late'?'Late':f)+'</button>';}).join('')+'</div>';
  h+=S.vt?'<div id="vtrack"></div>':'<div id="donefold"></div><div class="board four" id="lanes"></div>';
  document.getElementById('app').innerHTML=h;
  renderLanes();
}

/* ---------------------------------------------------- one video across every wedding: delivered, about to be late, late.
   The week is counted from the wedding day: days 1-7 = week 1, 8-14 = week 2 ... (for a delivered video: the week it was delivered).
   "About to be late" = due in the next 4 days (Teaser) or 7 days (Highlight, Documentary) — the same windows as the board. */
var VT=[['teaser','Teaser'],['hl','Highlight'],['doc','Documentary'],['cer','Ceremony']];
function usIso(us){ var p=String(us||'').split('/'); return p.length===3&&p[2].length===4?p[2]+'-'+p[0]+'-'+p[1]:''; }
function dBetween(a,b){ return Math.round((Date.parse(b+'T12:00:00Z')-Date.parse(a+'T12:00:00Z'))/864e5); }
function weekOf(days){ return Math.max(1,Math.ceil(days/7)); }
function vtSoon(type){ return type==='teaser'?4:7; }
function vtRows(type){
  var t=todayIso(), out=[];
  S.data.cards.forEach(function(c){
    if(!c.matched || !c.iso || c.daysSince<0) return;            // only weddings that already happened
    c.videos.forEach(function(v){
      if(v.type!==type || v.editor==='ASK') return;                // not assigned yet: shown on the board as "Assign editors"
      var r={c:c,v:v}, dueIso=usIso(v.due);
      if(v.done){
        var di=usIso(v.done);
        r.kind='done'; r.days=di?dBetween(c.iso,di):c.daysSince; r.lateBy=di&&dueIso?dBetween(dueIso,di):0; r.sort=di||'';
      } else {
        r.left=dueIso?dBetween(t,dueIso):0; r.days=c.daysSince;
        r.kind=r.left<0?'late':r.left<=vtSoon(type)?'soon':'ok'; r.sort=dueIso;
      }
      r.week=weekOf(r.days);
      out.push(r);
    });
  });
  return out;
}
function vtSet(t){ S.vt=S.vt===t?'':t; S.vk=''; render(); }
function vtButtons(){
  var vts=VT.filter(function(x){ return x[0]!=='cer' || S.data.cards.some(function(c){ return c.videos.some(function(v){ return v.type==='cer'; }); }); });
  return '<div class="vtabs"'+(vts.length>3?' style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))"':'')+'>'+vts.map(function(x){
    var r=vtRows(x[0]), n=function(k){ return r.filter(function(y){return y.kind===k;}).length; }, lt=n('late'), so=n('soon');
    return '<button class="vtab'+(S.vt===x[0]?' on':'')+'" onclick="vtSet(\''+x[0]+'\')" aria-pressed="'+(S.vt===x[0])+'"><span class="vname">'+x[1]+'</span><span class="vcount">'+
      '<b class="'+(lt?'l':'z')+'">'+lt+' late</b><b class="'+(so?'s':'z')+'">'+so+' about to be late</b><b class="d">'+n('done')+' delivered</b></span></button>';
  }).join('')+'</div>';
}
function vtStatus(r){
  var v=r.v, c=r.c, s='', x=[];
  if(r.kind==='done'){
    s='Delivered '+esc(v.done)+(r.lateBy>0?' · '+r.lateBy+(r.lateBy===1?' day':' days')+' late':' · on time');
    if(c.revOpen===v.type) x.push('In revision');
    x.push(v.sent?'Sent to the couple '+esc(v.sent):v.up?'On MediaZilla, not sent yet':'Waiting for upload to MediaZilla');
  } else {
    s=r.kind==='late'?(-r.left)+(r.left===-1?' day':' days')+' late':r.left===0?'Due today':'Due in '+r.left+(r.left===1?' day':' days');
    if(!c.footage) x.push('No footage yet'); else if(!v.given) x.push('Not handed to '+esc(v.editor)+' yet');
  }
  return '<div class="st '+r.kind+'">'+s+'</div>'+(x.length?'<div class="xtra">'+x.join(' · ')+'</div>':'');
}
function vtTable(rows,doneCol){
  return '<div class="vt"><table><colgroup><col style="width:29%"><col style="width:14%"><col style="width:13%"><col style="width:13%"><col style="width:31%"></colgroup><thead><tr><th>Couple</th><th>'+(doneCol?'Delivered in':'Now in')+'</th><th>Editor</th><th>Due</th><th>Status</th></tr></thead><tbody>'+
    rows.map(function(r){
      return '<tr onclick="vtOpen(\''+encodeURIComponent(r.c.couple).replace(/'/g,'%27')+'\')" title="Show this wedding on the board"><td><div class="cp">'+esc(r.c.couple)+'</div><div class="mt">Wedding '+esc(r.c.date)+(r.c.pkg?' · '+esc(r.c.pkg):'')+'</div></td>'+
        '<td><span class="wk '+r.kind+'">Week '+r.week+'</span><div class="mt">'+(r.days===0?'wedding day':r.days+(r.days===1?' day':' days')+' after')+'</div></td>'+
        '<td>'+esc(r.v.editor==='ASK'?'Not chosen yet':r.v.editor||'—')+'</td><td>'+esc(r.v.due)+'</td><td>'+vtStatus(r)+'</td></tr>';
    }).join('')+'</tbody></table></div>';
}
function vtOpen(couple){ S.vt=''; S.vk=''; S.filter='all'; S.q=decodeURIComponent(couple); render(); }
function vtKind(k){ S.vk=S.vk===k?'':k; renderVT(); }
function renderVT(){
  var box=document.getElementById('vtrack'); if(!box) return;
  var type=S.vt, name=VT.filter(function(x){return x[0]===type;})[0][1], q=S.q.trim().toLowerCase(), ed=EDS.indexOf(S.filter)>=0?S.filter:'';
  var rows=vtRows(type).filter(function(r){
    if(q && r.c.couple.toLowerCase().indexOf(q)<0) return false;
    if(ed && r.v.editor!==ed) return false;
    if(S.filter==='late' && r.kind!=='late') return false;
    return true;
  });
  function of(k){ return rows.filter(function(r){return r.kind===k;}); }
  var done=of('done').sort(function(a,b){ return a.sort<b.sort?1:a.sort>b.sort?-1:0; }),
      late=of('late').sort(function(a,b){ return a.left-b.left; }), soon=of('soon').sort(function(a,b){ return a.left-b.left; }), ok=of('ok').sort(function(a,b){ return a.left-b.left; });

/* scroll bar on top of the columns, kept in step with the board */
function linkBars(){
  var lanes=document.getElementById('lanes'), track=document.getElementById('track'), thumb=document.getElementById('thumb'), box=document.getElementById('hscroll');
  if(!lanes||!track) return;
  var max=lanes.scrollWidth-lanes.clientWidth;
  box.classList.toggle('off', max<=2);
  if(max<=2) return;
  var tw=track.clientWidth, w=Math.max(40, tw*lanes.clientWidth/lanes.scrollWidth);
  thumb.style.width=w+'px';
  thumb.style.left=((tw-w)*lanes.scrollLeft/max)+'px';
  if(lanes.dataset.linked) return;
  lanes.dataset.linked='1';
  lanes.addEventListener('scroll',linkBars);
  var drag=null;
  thumb.addEventListener('pointerdown',function(e){ e.preventDefault(); e.stopPropagation(); drag={x:e.clientX,s:lanes.scrollLeft}; thumb.classList.add('drag'); thumb.setPointerCapture(e.pointerId); });
  thumb.addEventListener('pointermove',function(e){
    if(!drag) return; var m=lanes.scrollWidth-lanes.clientWidth, room=track.clientWidth-thumb.offsetWidth;
    if(room>0) lanes.scrollLeft=drag.s+(e.clientX-drag.x)*m/room;
  });
  var end=function(){ drag=null; thumb.classList.remove('drag'); };
  thumb.addEventListener('pointerup',end); thumb.addEventListener('pointercancel',end);
  track.addEventListener('pointerdown',function(e){   // click on the empty part of the bar: jump there
    if(e.target!==track) return;
    var r=track.getBoundingClientRect(), m=lanes.scrollWidth-lanes.clientWidth, w2=thumb.offsetWidth;
    var pos=Math.min(1,Math.max(0,(e.clientX-r.left-w2/2)/(r.width-w2)));
    lanes.scrollTo({left:pos*m,behavior:'smooth'});
  });
}
function slide(dir){
  var lanes=document.getElementById('lanes'); if(!lanes) return;
  var lane=lanes.querySelector('.lane'), step=lane?lane.getBoundingClientRect().width+12:300;

}

/* ---------------------------------------------------- live updates
   Every 20 s the page asks "did anything change?". If yes, it reloads quietly and says what moved.
   Every 5 min it reloads anyway, so new weddings from the master appear. Never while you are typing. */
var POLL_MS=20000, FULL_MS=300000, polling=false;
function userBusy(){
  var a=document.activeElement, t=a&&a.tagName;
  return M || S.confirm || t==='INPUT' || t==='TEXTAREA' || t==='SELECT' || document.getElementById('app').classList.contains('loading');
}
function changes(oldD,newD){
  var before={}, out=[], fresh=0;
  (oldD.cards||[]).forEach(function(c){ before[c.key]=c; });
  (newD.cards||[]).forEach(function(c){
    var o=before[c.key];
    if(!o){ fresh++; return; }
    if(!o.footage && c.footage) out.push('Footage in NAS for '+c.couple);
    if(c.inRevision && !o.inRevision) out.push(c.couple+': client asked for changes ('+c.revLabel+')');
    if(!c.inRevision && o.inRevision) out.push('Revision done for '+c.couple+' — ready to send');
    (c.videos||[]).forEach(function(v){
      var ov=(o.videos||[]).filter(function(x){return x.type===v.type;})[0];
      if(v.done && !(ov&&ov.done)) out.push(v.editor+' delivered the '+v.label+' for '+c.couple);
      else if(v.done && v.up && ov && ov.done && !ov.up) out.push(v.label+' for '+c.couple+' is on MediaZilla — ready to send');
      else if(ov && ov.editor!==v.editor) out.push(v.label+' for '+c.couple+' moved to '+v.editor);
    });
    (c.videos||[]).forEach(function(v){ var ov=(o.videos||[]).filter(function(x){return x.type===v.type;})[0]; if(v.sent && !(ov&&ov.sent)) out.push(v.label+' sent for '+c.couple); });
    if(c.closed && !o.closed) out.push(c.couple+' closed');
    if(!c.closed && o.closed) out.push(c.couple+' reopened');
  });
  if(fresh) out.push(fresh+(fresh===1?' new wedding':' new weddings')+' on the board');
  if(!out.length) return '';
  return 'Updated: '+out.slice(0,3).join(' · ')+(out.length>3?' · and '+(out.length-3)+' more':'');
}
function quietLoad(){
  if(userBusy()||polling) return;
  polling=true;
  server('ccLoad',[BOOT.k],function(d){
    polling=false;
    if(userBusy()) return;                       // you started typing meanwhile: try again next round
    var msg=changes(S.data,d), lanes=document.getElementById('lanes'), x=lanes?lanes.scrollLeft:0, y=window.scrollY;
    S.data=d; S.version=d.version; S.lastFull=Date.now(); S.stale=false; saveCopy(d); render();
    lanes=document.getElementById('lanes'); if(lanes) lanes.scrollLeft=x; window.scrollTo(0,y);
    if(msg) toast(msg);
  },function(){ polling=false; });
}
function poll(){
  if(!S.data || document.hidden || userBusy() || polling) return;
  if(Date.now()-(S.lastFull||0) > FULL_MS) return quietLoad();
  server('ccVersion',[BOOT.k],function(v){ if(v!==S.version) quietLoad(); },function(){});
}
if (CONNECTED) {
  setInterval(poll, POLL_MS);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) poll(); });
}

}
function pPrev(t,key){ if(t==='month') return mkPrev(key); if(t==='year') return String(+key-1); var y=+key.slice(0,4), q=+key.slice(6)-1; if(!q){ y--; q=4; } return y+'-Q'+q; }
function pLY(t,key){ if(t==='month') return mkLY(key); if(t==='year') return String(+key-1); return (+key.slice(0,4)-1)+key.slice(4); }
function pName(t,key,short){ if(t==='month') return short?monthName(key,1)+' '+key.slice(0,4):mkName(key); if(t==='year') return key; var q=+key.slice(6); return 'Q'+q+' '+key.slice(0,4)+(short?'':' ('+MSH[(q-1)*3]+'–'+MSH[(q-1)*3+2]+')'); }
/* how far into the selected period we are: -1 = finished, else index of this month inside it */
function pIdx(){ return pMonths(mkT(),pSel()).indexOf(MK.cur); }
function pFair(){ return pIdx()>=0; }
function pVal(t,key,k,fair){

function mkDelta(a,b,pctOnly){

}

/* bar chart: this year's periods (solid) next to last year's (faded) — months, quarters or years */

  else { for(var y=2025;y<=+MK.cur.slice(0,4);y++){ keys.push(String(y)); labels.push(String(y)); } }
  var cur=t==='month'?MK.cur:t==='quarter'?qOf(MK.cur):MK.cur.slice(0,4);
  function val(key){ if(t==='month') return mkV(key,k,false); var ms=pMonths(t,key), s=0, any=false; for(var i=0;i<ms.length;i++){ if(ms[i]>MK.cur) break; var v=mkV(ms[i],k,false); if(v===null) return null; s+=v; any=true; } return any?s:null; }

  var max=Math.max.apply(null,a.concat(b).map(function(v){return v||0;}).concat([1])), n=keys.length, W=760, H=200, L=34, cw=(W-L)/n, top=18;

  keys.forEach(function(key,i){

    if(two&&vb!==null){ var hb=Math.round(H*vb/max); h+='<rect x="'+x0+'" y="'+(top+H-hb)+'" width="'+bw+'" height="'+hb+'" rx="3" fill="'+col+'" opacity=".32"><title>'+esc(pName(t,pLY(t,key),true)+': '+vb)+'</title></rect>'; if(vb) h+='<text x="'+(x0+bw/2)+'" y="'+(top+H-hb-5)+'" text-anchor="middle" style="font-size:10.5px">'+vb+'</text>'; }

  if(t==='month'){

      h+='</tr>';

/* the table for the chosen view: every month, every quarter or every year next to the same one a year before */
function mkPeriodTable(){
  var t=mkT(), yr=pSel().slice(0,4), keys=[];
  if(t==='month'){ for(var i=1;i<=12;i++){ var m=yr+'-'+('0'+i).slice(-2); if(m<=MK.cur) keys.push(m); } }
  else if(t==='quarter'){ for(var q=1;q<=4;q++){ var qk=yr+'-Q'+q; if(pMonths('quarter',qk)[0]<=MK.cur) keys.push(qk); } }
  else { for(var y=2025;y<=+MK.cur.slice(0,4);y++) keys.push(String(y)); }
  function inProg(key){ return pMonths(t,key).indexOf(MK.cur)>=0; }
  function val(key,k,fairTo){ /* fairTo: the period whose progress sets the cut-off */
    var ms=pMonths(t,key), idx=fairTo?pMonths(t,fairTo).indexOf(MK.cur):-1, s=0;
    if(idx>=0) ms=ms.slice(0,idx+1);
    for(var i=0;i<ms.length;i++){ if(ms[i]>MK.cur) break; var v=mkV(ms[i],k,idx>=0&&i===idx); if(v===null) return null; s+=v; } return s; }
  var before=t==='year'?function(k){ return String(+k-1); }:function(k){ return pLY(t,k); };
  var h='<div class="tbl"><table><tr><th>'+(t==='month'?'Month':t==='quarter'?'Quarter':'Year')+'</th>';
  MKM.forEach(function(x){ h+='<th style="color:var(--c-'+x[0]+')">'+x[1]+'</th><th>Change</th>'; });
  if(t==='quarter') h+='<th>Booked vs quarter before</th>';
  h+='</tr>';
  var ta={}, tb={}; MKM.forEach(function(x){ ta[x[0]]=0; tb[x[0]]=null; });
  keys.forEach(function(key){
    var part=inProg(key), fk=part?key:null;
    h+='<tr'+(key===pSel()?' class="sel"':'')+'><td>'+esc(t==='month'?monthName(key):t==='quarter'?pName(t,key):key)+(part?' <span class="dim">(to '+monthName(MK.cur,1)+' '+MK.day+')</span>':'')+'</td>';
    MKM.forEach(function(x){
      var a=val(key,x[0],fk), b=val(before(key),x[0],fk), d=mkDelta(a,b,true);
      if(a!==null) ta[x[0]]+=a; if(b!==null) tb[x[0]]=(tb[x[0]]||0)+b;
      h+='<td><b>'+(a===null?'—':a)+'</b> <span class="dim">/ '+(b===null?'—':b)+'</span></td><td class="'+d.c+'">'+(b===null?'':d.t)+'</td>';
    });
    if(t==='quarter'){ var pk=pPrev('quarter',key), d2=mkDelta(val(key,'booked',fk),val(pk,'booked',fk),true); h+='<td class="'+d2.c+'">'+(val(pk,'booked',fk)===null?'—':d2.t)+'</td>'; }
    h+='</tr>';
  });
  if(t!=='year'){
    h+='<tr class="sel"><td><b>Year so far</b></td>';
    MKM.forEach(function(x){ var d=mkDelta(ta[x[0]],tb[x[0]],true); h+='<td><b>'+ta[x[0]]+'</b> <span class="dim">/ '+(tb[x[0]]===null?'—':tb[x[0]])+'</span></td><td class="'+d.c+'">'+(tb[x[0]]===null?'':d.t)+'</td>'; });
    if(t==='quarter') h+='<td></td>';
    h+='</tr>';
  }

/* ---------- seasons ---------- */
function mkBand(vals){ /* peak / slow months against the average of the months that have data */
  var have=vals.filter(function(v){return v!==null;}), avg=have.reduce(function(s,v){return s+v;},0)/(have.length||1);
  return vals.map(function(v){ return v===null||!avg?'':v>=avg*1.15?'peak':v<=avg*0.85?'slow':''; });
}
function mkBandRow(band,x0,cw,y){
  var h='';
  band.forEach(function(b,i){ if(!b) return; h+='<rect x="'+(x0+i*cw+3)+'" y="'+y+'" width="'+(cw-6)+'" height="8" rx="4" fill="'+(b==='peak'?'var(--c-booked)':'var(--down)')+'" opacity="'+(b==='peak'?.85:.55)+'"><title>'+(b==='peak'?'Busy month':'Slow month')+'</title></rect>'; });
  return h;
}
function mkNames(band,want){ var o=[]; band.forEach(function(b,i){ if(b===want) o.push(MSH[i]); }); return o.length?o.join(', '):'none'; }
/* when bookings (or inquiries) come in: one line per year, and the average of the full months behind the busy/slow band */
function mkBookingSeason(){
  var k=S.sbm||'booked', col='var(--c-'+k+')', years=[], y0=2025, y1=+MK.cur.slice(0,4);
  for(var y=y0;y<=y1;y++) years.push(y);
  var series=years.map(function(y){ return MSH.map(function(_,i){ var m=y+'-'+('0'+(i+1)).slice(-2); if(m>MK.cur||!mkHas(m)) return null; return mkV(m,k,false); }); });
  var avg=MSH.map(function(_,i){ var s=0,n=0; years.forEach(function(y,j){ var m=y+'-'+('0'+(i+1)).slice(-2); if(m<MK.cur&&series[j][i]!==null){ s+=series[j][i]; n++; } }); return n?Math.round(s/n):null; });
  var band=mkBand(avg), max=Math.max.apply(null,[].concat.apply([],series).concat(avg).map(function(v){return v||0;}).concat([1]));
  var W=760, H=190, L=34, cw=(W-L)/12, top=14, h='<svg viewBox="0 0 '+W+' '+(H+58)+'" role="img" aria-label="Booking season">';
  [0,.5,1].forEach(function(f){ var yy=top+H-Math.round(H*f); h+='<line x1="'+L+'" x2="'+W+'" y1="'+yy+'" y2="'+yy+'" stroke="var(--line)"/><text x="'+(L-6)+'" y="'+(yy+4)+'" text-anchor="end">'+Math.round(max*f)+'</text>'; });
  function px(i){ return L+i*cw+cw/2; } function py(v){ return top+H-Math.round(H*v/max); }
  series.forEach(function(s,j){
    var last=j===series.length-1, d='', pts='';
    s.forEach(function(v,i){ if(v===null) return; d+=(d?'L':'M')+px(i)+' '+py(v); pts+='<circle cx="'+px(i)+'" cy="'+py(v)+'" r="'+(last?4:3)+'" fill="'+col+'" opacity="'+(last?1:.45)+'"><title>'+esc(MSH[i]+' '+years[j]+': '+v)+'</title></circle>'; });
    h+='<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="'+(last?3:2)+'" opacity="'+(last?1:.45)+'"/>'+pts;
    var li=-1; s.forEach(function(v,i){ if(v!==null) li=i; }); if(li>=0) h+='<text x="'+(px(li)+7)+'" y="'+(py(s[li])+4)+'" class="v" style="font-size:11px">'+years[j]+'</text>';
  });
  MSH.forEach(function(n,i){ h+='<text x="'+px(i)+'" y="'+(top+H+18)+'" text-anchor="middle">'+n+'</text>'; });
  h+=mkBandRow(band,L,cw,top+H+28);
  h+='<text x="'+L+'" y="'+(top+H+54)+'" style="font-size:11px">Band under the months: green = busy, red = slow (against the monthly average of the full months).</text>';
  return { svg:h+'</svg>', peak:mkNames(band,'peak'), slow:mkNames(band,'slow') };
}
/* when they get married: weddings on the calendar (master) per month */
function mkWeddingSeason(){
  var W0=MK.seasons&&MK.seasons.wed||{}, ys={};
  Object.keys(W0).forEach(function(k){ ys[k.slice(0,4)]=1; });
  var years=Object.keys(ys).sort(), cy=+MK.cur.slice(0,4);
  var full=years.filter(function(y){ return +y<=cy; }), base=full.length?full[full.length-1]:years[0];
  if(!base) return null;
  var vals=function(y){ return MSH.map(function(_,i){ return W0[y+'-'+('0'+(i+1)).slice(-2)]||0; }); };
  var bv=vals(base), band=mkBand(bv), max=1; years.forEach(function(y){ vals(y).forEach(function(v){ max=Math.max(max,v); }); });
  var W=760, H=190, L=34, cw=(W-L)/12, top=14, n=years.length, h='<svg viewBox="0 0 '+W+' '+(H+58)+'" role="img" aria-label="Wedding season">';
  [0,.5,1].forEach(function(f){ var yy=top+H-Math.round(H*f); h+='<line x1="'+L+'" x2="'+W+'" y1="'+yy+'" y2="'+yy+'" stroke="var(--line)"/><text x="'+(L-6)+'" y="'+(yy+4)+'" text-anchor="end">'+Math.round(max*f)+'</text>'; });
  MSH.forEach(function(m,i){
    var x=L+i*cw, bw=(cw-10)/n;
    years.forEach(function(y,j){ var v=vals(y)[i], hh=Math.round(H*v/max), on=y===base;
      h+='<rect x="'+(x+5+j*bw)+'" y="'+(top+H-hh)+'" width="'+(bw-2)+'" height="'+hh+'" rx="3" fill="var(--c-signed)" opacity="'+(on?1:+y>cy?.35:.55)+'"><title>'+esc(m+' '+y+': '+v+' weddings'+(+y>cy?' (booked so far)':''))+'</title></rect>';
      if(on&&v) h+='<text x="'+(x+5+j*bw+(bw-2)/2)+'" y="'+(top+H-hh-5)+'" text-anchor="middle" class="v" style="font-size:11px">'+v+'</text>'; });
    h+='<text x="'+(x+cw/2)+'" y="'+(top+H+18)+'" text-anchor="middle">'+m+'</text>';
  });
  h+=mkBandRow(band,L,cw,top+H+28);
  h+='<text x="'+L+'" y="'+(top+H+54)+'" style="font-size:11px">Bright bars = '+base+' (the band is based on it). '+years.filter(function(y){return y!==base;}).map(function(y){ return y+(+y>cy?' = booked so far':''); }).join(' · ')+'</text>';
  return { svg:h+'</svg>', peak:mkNames(band,'peak'), slow:mkNames(band,'slow'), base:base, years:years };
}
/* when each wedding month books: rows = wedding month, columns = the month the deposit was paid */
function mkHeat(){
  var se=MK.seasons||{}, mat=se.mat||[], med=se.leadMed||[];
  if(!se.pairs) return '';
  var W=760, L=46, R=96, cw=(W-L-R)/12, RH=26, top=22, h='<svg viewBox="0 0 '+W+' '+(top+RH*12+8)+'" role="img" aria-label="When each wedding month books">';
  MSH.forEach(function(m,i){ h+='<text x="'+(L+i*cw+cw/2)+'" y="14" text-anchor="middle">'+m+'</text>'; });
  h+='<text x="'+(W-R+8)+'" y="14">Books ahead</text>';
  mat.forEach(function(row,w){
    var y=top+w*RH, mx=Math.max.apply(null,row.concat([1])), tot=row.reduce(function(s,v){return s+v;},0);
    h+='<text x="0" y="'+(y+17)+'" class="v">'+MSH[w]+'</text>';
    row.forEach(function(v,b){
      var a=v?.12+.88*v/mx:0;
      h+='<rect x="'+(L+b*cw+1)+'" y="'+(y+1)+'" width="'+(cw-2)+'" height="'+(RH-2)+'" rx="4" fill="'+(v?'var(--c-booked)':'var(--field)')+'" opacity="'+(v?a.toFixed(2):1)+'"><title>'+esc(MSH[w]+' weddings booked in '+MSH[b]+': '+v+(tot?' ('+Math.round(v/tot*100)+'%)':''))+'</title></rect>';
      if(v) h+='<text x="'+(L+b*cw+cw/2)+'" y="'+(y+17)+'" text-anchor="middle" style="font-size:11px;fill:'+(a>.55?'#0E1A10':'var(--ink)')+'">'+v+'</text>';
    });
    h+='<text x="'+(W-R+8)+'" y="'+(y+17)+'" class="v">'+(med[w]===null||med[w]===undefined?'—':'~'+med[w]+' mo')+'</text>';
  });
  return h+'</svg>';
}
function mkHeatSummary(){
  var mat=(MK.seasons||{}).mat||[], med=(MK.seasons||{}).leadMed||[], out=[];
  mat.forEach(function(row,w){ var tot=row.reduce(function(s,v){return s+v;},0); if(tot<6) return;
    var top=row.map(function(v,b){return [v,b];}).sort(function(a,b){return b[0]-a[0];}).slice(0,3).filter(function(x){return x[0];}).map(function(x){return MSH[x[1]];});
    out.push({w:w,tot:tot,top:top,med:med[w]}); });
  out.sort(function(a,b){ return b.tot-a.tot; });
  return out.slice(0,5).map(function(x){ return '<li><b>'+MSH[x.w]+' weddings</b> mostly book in '+x.top.join(', ')+(x.med!==null&&x.med!==undefined?' · about '+x.med+' months ahead':'')+' <span class="dim">('+x.tot+' bookings)</span></li>'; }).join('');
}
function mkLeadHist(){
  var hs=(MK.seasons||{}).leadHist||[], tot=hs.reduce(function(s,v){return s+v;},0)||1, lab=['under 3 mo','3–6 mo','6–9 mo','9–12 mo','12–18 mo','18+ mo'], max=Math.max.apply(null,hs.concat([1]));
  var W=520, RH=30, h='<svg viewBox="0 0 '+W+' '+(RH*6+4)+'" role="img" aria-label="How far ahead couples book">';
  hs.forEach(function(v,i){ var y=i*RH, w=Math.round(300*v/max); h+='<text x="0" y="'+(y+19)+'" class="v">'+lab[i]+'</text><rect x="110" y="'+(y+7)+'" width="'+Math.max(v?3:0,w)+'" height="14" rx="4" fill="var(--c-call)"/><text x="'+(118+w)+'" y="'+(y+19)+'">'+v+' · '+Math.round(v/tot*100)+'%</text>'; });
  return h+'</svg>';
}

function renderMarketing(){
  var d=S.data, h='<header><div><h1>Marketing <span class="ver">alpha 2</span></h1><div class="sub">Only you see this · today '+esc(d.today)+(MK&&MK.updated?' · emails read '+esc(MK.updated):'')+' · updates by itself at 6 AM, 12 PM and 6 PM</div></div>'+
    '<div class="row" style="margin:0">'+viewSwitch()+'<button class="chip" onclick="MK=null;loadMkt();renderMarketing()">Refresh</button></div></header>';
  if(!MK){
    h+=MKERR?'<div class="warn-box">Marketing could not load: '+esc(MKERR)+' <button class="chip" onclick="loadMkt();renderMarketing()">Try again</button></div>':'<p class="sub">Loading the numbers…</p>';
    document.getElementById('app').innerHTML=h; if(!MKERR) loadMkt(); return;
  }
  var t=mkT(), sel=pSel(), fair=pFair(), cm=mkCmps();
  h+='<div class="mk">';
  /* period switch + period picker */
  var opts=[], seen={};
  MK.months.slice().reverse().filter(function(m){return mkHas(m);}).forEach(function(m){
    var key=t==='month'?m:t==='quarter'?qOf(m):m.slice(0,4); if(seen[key]) return; seen[key]=1;
    var cur=pMonths(t,key).indexOf(MK.cur)>=0;
    var inside=pMonths(t,key).filter(function(x){ return x<=MK.cur; });
    opts.push('<option value="'+inside[inside.length-1]+'"'+(key===sel?' selected':'')+'>'+esc(pName(t,key))+(cur?' (so far)':'')+'</option>');
  });
  h+='<div class="ctl"><span class="views" role="tablist">'+[['month','Month'],['quarter','Quarter'],['year','Year']].map(function(x){ return '<button role="tab" aria-selected="'+(t===x[0])+'" class="'+(t===x[0]?'on':'')+'" onclick="S.mp=\''+x[0]+'\';renderMarketing()">'+x[1]+'</button>'; }).join('')+'</span>'+
     '<select onchange="S.mm=this.value;renderMarketing()" aria-label="Period">'+opts.join('')+'</select>'+
     '<span class="sub">'+(fair?'In progress: every comparison stops at the same point ('+esc(monthName(MK.cur,1))+' '+MK.day+'), so it is fair.':'Whole periods compared.')+'</span></div>';
  if(!(MK.history&&MK.history.rows)) h+='<div class="warn-box">Last year is still loading from your emails. The “last year” columns fill in by themselves when it finishes.</div>';
  h+='<div class="kpis">'+MKM.map(function(x){
    var a=pVal(t,sel,x[0],fair);
    return '<div class="kpi" style="--c:var(--c-'+x[0]+')"><div class="k">'+x[1]+'</div><div class="v">'+(a===null?'—':a)+'</div><div class="chips">'+
      cm.map(function(c){ return mkChip(pLabel(t,c[0]),a,pVal(t,c[0],x[0],fair)); }).join('')+'</div>'+mkSpark(x[0])+'</div>';
  }).join('')+'</div>';
  h+='<div class="grid2 wide"><section class="sec"><h2>The funnel · '+esc(pName(t,sel))+'</h2><p class="lede">Solid = '+esc(pLabel(t,sel))+'. Dashed outline = '+esc(pLabel(t,pLY(t,sel)))+'.</p>'+mkFunnel()+'</section>'+
     '<section class="sec"><h2>Against '+(t==='year'?'last year':'the '+(t==='month'?'month':'quarter')+' before and last year')+'</h2><p class="lede">Green = better, red = worse. “Per 100 inquiries” compares what happened in the same period.</p>'+mkCompareTable()+'</section></div>';
  var mlabel=(MKM.filter(function(x){return x[0]===(S.mmet||'new');})[0]||MKM[0])[1], yr=sel.slice(0,4);
  h+='<section class="sec"><h2>'+esc(mlabel)+' by '+(t==='month'?'month':t==='quarter'?'quarter':'year')+(t==='year'?'':' · '+yr+' against '+(+yr-1))+'</h2>'+
     '<div class="legend">'+(t==='year'?'<span>Bars = each year (dashed = so far)</span><span>White line = last year by the same day</span>':'<span><i style="background:var(--c-'+(S.mmet||'new')+')"></i>'+yr+'</span><span><i style="background:var(--c-'+(S.mmet||'new')+');opacity:.32"></i>'+(+yr-1)+'</span><span>Dashed = in progress · white line = last year by the same day</span>')+'</div>'+
     '<div class="ctl" style="margin-bottom:8px">'+MKM.map(function(x){ return '<button class="chip'+((S.mmet||'new')===x[0]?' on':'')+'" onclick="S.mmet=\''+x[0]+'\';renderMarketing()">'+x[1]+'</button>'; }).join('')+'</div>'+mkTrend()+'</section>';
  h+='<section class="sec"><h2>'+(t==='month'?'Month by month':t==='quarter'?'Quarter by quarter':'Year by year')+(t==='year'?'':' · '+yr+' / '+(+yr-1))+'</h2><p class="lede">Each cell: '+(t==='year'?'that year / the year before':'this year / the same '+(t==='month'?'month':'quarter')+' a year before')+', then the change.'+(t==='quarter'?' Last column: bookings against the quarter before.':'')+'</p>'+mkPeriodTable()+'</section>';
  var src=mkSources();
  h+='<section class="sec"><h2>Where inquiries come from · '+esc(pName(t,sel))+'</h2><p class="lede">From “How did you hear about us?” on the inquiry form. Blue = inquiries, green line = booked, dashed outline = same period last year.</p>'+
     (src.empty?'<p class="sub">No inquiries with a source in this period yet.</p>':'<div class="grid2 wide"><div>'+src.chart+'</div><div>'+src.table+'</div></div>')+'</section>';
  /* seasons */
  var bs=mkBookingSeason(), ws=mkWeddingSeason(), se=MK.seasons||{};
  h+='<h2 class="mkh">Seasons</h2>';
  h+='<section class="sec"><h2>Booking season · when '+((S.sbm||'booked')==='booked'?'bookings':'inquiries')+' come in</h2>'+
     '<div class="ctl" style="margin-bottom:8px">'+[['booked','Bookings'],['new','Inquiries']].map(function(x){ return '<button class="chip'+((S.sbm||'booked')===x[0]?' on':'')+'" onclick="S.sbm=\''+x[0]+'\';renderMarketing()">'+x[1]+'</button>'; }).join('')+'</div>'+
     '<div class="season"><span class="pk">Busy: <b>'+esc(bs.peak)+'</b></span><span class="sl">Slow: <b>'+esc(bs.slow)+'</b></span></div>'+bs.svg+'</section>';
  if(ws) h+='<section class="sec"><h2>Wedding season · when couples get married</h2><p class="lede">Weddings on your calendar (the master), by month.</p>'+
     '<div class="season"><span class="pk">Busy: <b>'+esc(ws.peak)+'</b></span><span class="sl">Slow: <b>'+esc(ws.slow)+'</b></span></div>'+ws.svg+'</section>';
  if(se.pairs){
    h+='<div class="grid2 wide"><section class="sec"><h2>How far ahead they book</h2><p class="lede">Months between the deposit and the wedding, '+se.pairs+' bookings since January 2025.</p>'+mkLeadHist()+'</section>'+
       '<section class="sec"><h2>When each wedding month books</h2><p class="lede">Read across a row: the months in which those couples paid their deposit. Darker = more of that row. Hover a square for the number.</p>'+mkHeat()+
       '<ul class="mklist">'+mkHeatSummary()+'</ul></section></div>';
  }
  h+='<p class="note">How it is counted: Inquiries = website forms plus consultation calls booked without a form · Calls = Calendly consultation calls · Contracts = first contract emailed · Signed = Dubsado signature · Booked = deposit paid (the Sales Board date wins). Each one counts in the month it happened. Quarters and years add up their months. Wedding dates come from the contract on the Sales Board, otherwise from the inquiry form. Test entries and rows marked IGNORE are left out. '+
     (MK.history&&MK.history.rows?'Last year: '+MK.history.rows+' brides from your emails, October 2024 to December 2025 (bookings from emails only, so they can be 1–2 off per month).':'')+'</p>';
  h+='</div>';
  document.getElementById('app').innerHTML=h;
}

function render(){ if(!S.data) return; if(S.data.role==='Rafael'||S.data.role==='Assistant'){ if(S.view==='mkt'&&S.data.role==='Rafael') renderMarketing(); else if(S.view==='brides'&&S.data.pipeline) renderBrides(); else renderBoard(); } else renderEditor(); }
if (CONNECTED) load();
else document.getElementById('app').innerHTML='<div class="warn-box">This page needs your private link. Ask Rafael for it.</div>';
</script>
