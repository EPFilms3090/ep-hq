<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>EP Films · Editing</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    color-scheme: dark;
    --ink:#F5F2EC; --cocoa:#D9CFC6; --muted:#B5ABA2; --taupe:#7D7168; --line:#3A3530; --ground:#121110; --card:#1E1C1A; --lane:#181715; --field:#272420;
    --ok-fg:#B7D6B1; --ok-bg:#1E2B1F; --ok-bd:#3E5A3B;
    --wait-fg:#CFC5BC; --wait-bg:#26231F; --wait-bd:#3F3A34;
    --due-fg:#F0CF85; --due-bg:#2E2616; --due-bd:#62501F;
    --bad-fg:#F4ADA4; --bad-bg:#3A1C19; --bad-bd:#73352E;
    --bar-done:#6E9B68; --bar-due:#C9A24E; --bar-late:#D0604F;
    --btn:#5A4A40; --btn-bd:#7A675A;
    --serif: Georgia, 'Times New Roman', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.4}
  .wrap{max-width:1400px;margin:0 auto;padding:16px}
  header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  h1{font-family:var(--serif);font-weight:400;font-size:28px;margin:0;letter-spacing:.02em}
  .sub{color:var(--muted);font-size:13px}
  .found{border-left:3px solid var(--ok,#8CF5A8);background:rgba(140,245,168,.08);padding:8px 10px;margin:4px 0 10px;font-size:13px;word-break:break-word}
  .found-in{flex-basis:100%;color:#8CF5A8}
  .label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;text-align:left;font:inherit;color:inherit}
  .tile .n{font-family:var(--serif);font-size:30px;line-height:1.1}
  .tile.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
  .tile.bad .n{color:var(--bad-fg)}
  .loads{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:14px}
  .load{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
  .bar{height:8px;border-radius:4px;background:var(--wait-bg);overflow:hidden;display:flex;margin-top:6px}
  .bar i{display:block;height:100%}
  .tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  input[type=search],input[type=date],select,textarea{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--field);color:var(--ink)}
  input[type=search]{flex:1;min-width:180px}
  .chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink)}
  .chip.on{background:var(--btn);color:#fff;border-color:var(--btn-bd)}
  .board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(290px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
  .hscroll{position:sticky;top:0;z-index:5;background:var(--ground);display:flex;align-items:center;gap:8px;padding:8px 0;margin-bottom:6px}
  .hscroll.off{display:none}
  .track{flex:1;position:relative;height:18px;border-radius:9px;background:var(--lane);border:1px solid var(--line);cursor:pointer;touch-action:none}
  .thumb{position:absolute;top:2px;bottom:2px;left:0;min-width:40px;border-radius:7px;background:var(--btn-bd);cursor:grab}
  .thumb:hover,.thumb.drag{background:var(--muted)} .thumb.drag{cursor:grabbing}
  .board::-webkit-scrollbar{height:12px} .board::-webkit-scrollbar-track{background:var(--lane);border-radius:8px}
  .board::-webkit-scrollbar-thumb{background:var(--btn-bd);border-radius:8px;border:3px solid var(--lane)}
  .arrow{min-width:40px;font-size:15px;line-height:1}
  .lane{background:var(--lane);border:1px solid var(--line);border-radius:12px;padding:10px;scroll-snap-align:start;min-height:120px}
  .lane h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--cocoa);margin:2px 4px 10px;display:flex;justify-content:space-between}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;cursor:pointer}
  .card.late{border-left:4px solid var(--bar-late)}
  .couple{font-family:var(--serif);font-size:19px;line-height:1.2}
  .meta{color:var(--muted);font-size:12.5px;margin-top:2px}
  .steps{display:flex;gap:4px;margin:10px 0 8px}
  .steps span{flex:1;height:6px;border-radius:3px;background:var(--line)}
  .steps .done{background:var(--bar-done)} .steps .due{background:var(--bar-due)} .steps .late{background:var(--bar-late)} .steps .ok{background:var(--taupe)}
  .pills{display:flex;flex-wrap:wrap;gap:6px}
  .pill{font-size:12px;border-radius:6px;padding:3px 8px;border:1px solid}
  .s-done{color:var(--ok-fg);background:var(--ok-bg);border-color:var(--ok-bd)}
  .s-ok,.s-waiting,.s-upcoming{color:var(--wait-fg);background:var(--wait-bg);border-color:var(--wait-bd)}
  .s-due{color:var(--due-fg);background:var(--due-bg);border-color:var(--due-bd)}
  .s-late{color:var(--bad-fg);background:var(--bad-bg);border-color:var(--bad-bd)}
  .detail{border-top:1px solid var(--line);margin-top:10px;padding-top:10px;cursor:default}
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0}
  .row .name{min-width:96px;font-weight:600;font-size:13px}
  .btn{font:inherit;font-size:13px;border-radius:8px;padding:8px 12px;border:1px solid var(--btn-bd);background:var(--btn);color:#fff;cursor:pointer}
  .btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
  .btn.warn{background:#8C3A32;border-color:#8C3A32}
  .btn:disabled{opacity:.5;cursor:default}
  a.btn{text-decoration:none;display:inline-block}
  .empty{color:var(--muted);font-size:13px;padding:8px 4px}
  .warn-box{background:var(--bad-bg);color:var(--bad-fg);border:1px solid var(--bad-bd);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:13px}
  #toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#33302C;color:#fff;border:1px solid var(--line);padding:10px 16px;border-radius:10px;font-size:14px;display:none;max-width:90vw;z-index:9}
  #toast.bad{background:#8C3A32}
  .loading{opacity:.5;pointer-events:none}
  .ed-list .card{cursor:default}
  .big{font-size:15px;padding:12px 16px}
  .btn.small{font-size:12px;padding:5px 10px;margin-top:10px}
  .notes-box{border:1px solid var(--due-bd);background:var(--due-bg);color:var(--due-fg);border-radius:8px;padding:10px 12px;margin:8px 0;font-size:14px;white-space:pre-wrap}
  .notes-box b{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:4px}
  .rev-box{border-color:var(--bad-bd);background:var(--bad-bg);color:var(--bad-fg)}
  .chk{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
  .chk input{accent-color:#7A675A;width:16px;height:16px}
  .s-ready{color:#BFD3F0;background:#1B2533;border-color:#33496A}
  .notes-box .txt{max-height:6.2em;overflow:hidden}
  .notes-box.full .txt{max-height:none}
  .more{font:inherit;font-size:13px;background:none;border:0;color:inherit;text-decoration:underline;padding:6px 0 0;cursor:pointer}
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:8;padding:16px}
  #modal.on{display:flex}
  #modal .box{background:var(--card);border:1px solid var(--line);border-radius:12px;width:min(820px,100%);max-height:94vh;display:flex;flex-direction:column;gap:12px;padding:18px}
  #modal .head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  #modal textarea{width:100%;min-height:52vh;resize:vertical;font-size:16px;line-height:1.55}
  #modal .view{white-space:pre-wrap;overflow:auto;font-size:16px;line-height:1.6;min-height:20vh;padding:4px 2px}
  #modal select{align-self:flex-start}
  .btn:focus-visible,.chip:focus-visible,.more:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--due-fg);outline-offset:2px}
  .views{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-right:6px}
  .views button{font:inherit;font-size:13px;background:var(--card);color:var(--ink);border:0;padding:7px 14px;cursor:pointer}
  .views button.on{background:var(--btn);color:#fff}
  .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .acts a{font-size:13px;border-radius:8px;padding:7px 11px;border:1px solid var(--line);color:var(--ink);text-decoration:none;background:var(--field)}
  .acts a:hover{border-color:var(--muted)}
  .bride{cursor:default}
  .mtiles{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
  .mtiles .tile .n{font-size:28px}
  .tile .cmp{font-size:12px;color:var(--muted);margin:2px 0 6px;min-height:16px}
  .tile .cmp b{color:var(--ink);font-weight:600}
  .mchart{display:block;width:100%;height:auto;overflow:visible}
  .mchart text{font-family:var(--sans);font-size:14px;fill:var(--muted)}
  .mchart text.v{fill:var(--ink)}
  .urgent{display:block;width:100%;text-align:left;font:inherit;font-size:14px;cursor:pointer}
  .lane .lsub{font-size:12px;color:var(--muted);margin:-6px 4px 10px}
  @media (max-width:640px){ .wrap{padding:12px} h1{font-size:23px} .board{grid-auto-columns:88%;scroll-snap-type:x mandatory} .hscroll{display:none} }
  /* Editing board: 4 columns that always fit the screen (no sideways scrolling) */
  .board.four{grid-auto-flow:row;grid-template-columns:repeat(4,minmax(0,1fr));overflow:visible;scroll-snap-type:none;align-items:start}
  .board.four .lane{min-width:0}
  .ver{font-family:var(--sans);font-size:12px;letter-spacing:.08em;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px;vertical-align:middle}
  .lane.mine{border-color:var(--due-bd)}
  .lane.mine h2{color:var(--due-fg)}
  .lane .lsub{font-size:12px;color:var(--muted);margin:-6px 4px 10px}
  @media (max-width:1000px){ .board.four{grid-template-columns:repeat(2,minmax(0,1fr))} }
  @media (max-width:640px){ .board.four{grid-template-columns:minmax(0,1fr)} }
  details.donefold{margin:0 0 14px;background:var(--lane);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  details.donefold summary{cursor:pointer;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--cocoa)}
  details.donefold .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-top:10px}
  .tile.mine .n{color:var(--due-fg)}
  .pickup{border:1px solid var(--due-bd);background:var(--due-bg);border-radius:8px;padding:10px 12px;margin:4px 0 10px}
  .pickup .label{color:var(--due-fg);margin-top:0}
  .chap{font-family:var(--mono, ui-monospace, Menlo, Consolas, monospace);font-size:13px}
  .checklist{display:grid;gap:6px;margin:6px 0}
  .ck{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start;font-size:14px;line-height:1.45;padding:6px 8px;border:1px solid var(--bad-bd);border-radius:8px;background:var(--bad-bg);color:var(--bad-fg);cursor:pointer}
  .ck input{width:18px;height:18px;margin:1px 0 0;accent-color:#6E9B68;cursor:pointer}
  .ck.on{background:var(--ok-bg);border-color:var(--ok-bd);color:var(--ok-fg)}
  .ck.on span{text-decoration:line-through;opacity:.8}
  .ck.ro{cursor:default}
  #modal .checklist .ck{font-size:17px;padding:10px 12px}
  #modal .checklist{overflow:auto;max-height:70vh}
  /* ---------- Marketing (Rafael only) ---------- */
  .mk{--c-new:#8EC5FF;--c-call:#B9A6FF;--c-sent:#F0CF85;--c-signed:#F5A97F;--c-booked:#8CF5A8;--up:#8CF5A8;--down:#FF9A8B;display:grid;gap:16px}
  .mk .sec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-width:0}
  .mk>*,.mk .grid2>*{min-width:0}
  .mk .ctl .sub{flex:1 1 220px;min-width:0}
  .mk .sec h2{font-family:var(--serif);font-weight:400;font-size:21px;margin:0 0 2px}
  .mk .sec .lede{color:var(--muted);font-size:13px;margin:0 0 12px}
  .mk .ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .mk .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:12px}
  .mk .kpi{background:var(--lane);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:12px;padding:12px 14px;display:grid;gap:6px;min-width:0}
  .mk .kpi .k{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .mk .kpi .v{font-family:var(--serif);font-size:40px;line-height:1;color:var(--c)}
  .mk .chips{display:flex;flex-wrap:wrap;gap:6px}
  .mk .dl{font-size:12px;border-radius:999px;padding:3px 8px;background:var(--field);color:var(--muted);white-space:nowrap}
  .mk .dl.up{color:var(--up);background:rgba(140,245,168,.10)} .mk .dl.down{color:var(--down);background:rgba(255,154,139,.10)}
  .mk .dl b{font-weight:600}
  .mk svg{display:block;width:100%;height:auto;overflow:visible}
  .mk svg text{font-family:var(--sans);fill:var(--muted);font-size:12px}
  .mk svg text.v{fill:var(--ink);font-weight:600}
  .mk svg text.big{font-size:15px}
  .mk .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:16px}
  .mk .grid2.wide{grid-template-columns:minmax(0,4fr) minmax(0,7fr)}
  @media (max-width:1100px){ .mk .grid2.wide{grid-template-columns:minmax(0,1fr)} }
  .mk .tbl.fit table{min-width:0;font-size:13px} .mk .tbl.fit th,.mk .tbl.fit td{padding:8px 7px}
  .mk .tbl.fit th{letter-spacing:.04em}
  .mk .tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
  .mk table{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
  .mk th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:right;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-weight:500;background:var(--lane)}
  .mk th:first-child,.mk td:first-child{text-align:left}
  .mk td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .mk tr:last-child td{border-bottom:0}
  .mk td .sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;vertical-align:-1px;background:var(--c)}
  .mk td.up{color:var(--up)} .mk td.down{color:var(--down)} .mk td.dim,.mk span.dim{color:var(--muted)}
  .mk tr.grp td{background:var(--lane);color:var(--muted);font-size:11px;letter-spacing:.1em;text-transform:uppercase;text-align:left}
  .mk tr.sel td{background:rgba(245,242,236,.06)}
  .mk .heat{border-radius:6px;padding:2px 6px}
  .mk .legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted);margin:2px 0 10px}
  .mk .legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-2px}
  .mk .note{color:var(--muted);font-size:12.5px}
  .mk .warn-box{margin:0}
  .mk .tag{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#0E1A10;background:var(--c-booked);border-radius:999px;padding:2px 8px;margin-left:8px;vertical-align:3px}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="sub">Loading…</p></div>
<div id="modal" onclick="if(event.target===this&&M&&M.mode==='view')closeModal()"></div>
<div id="toast"></div>
<script>window.EP_API="https://script.google.com/macros/s/AKfycbxjnfOSfxHyKDTHs1bEDh1jUUHruvAzmZEjYDTtr_6uwKSwm3DveB2-LFidnfmbZrOm2A/exec";</script>
<script>
var BOOT = null;
try { BOOT = JSON.parse(document.getElementById('boot').textContent); } catch (e) { BOOT = null; }
/* Two ways in: inside Google (google.script.run) or from the GitHub page (plain web requests, no Google login needed). */
var API = window.EP_API || '';
if (!BOOT && API) { var qk = (location.search.match(/[?&]k=([a-z0-9]{20})/) || [])[1]; if (qk) BOOT = { k: qk }; }
function server(fn, args, ok, fail){
  if (!API) { var r = google.script.run.withSuccessHandler(ok).withFailureHandler(fail); r[fn].apply(r, args); return; }
  var req = fn === 'ccAct'
    ? fetch(API, { method:'POST', credentials:'omit', redirect:'follow', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({ fn:'act', args:args }) })
    : fetchWithTimeout(API + '?api=' + (fn === 'ccLoad' ? 'load' : fn === 'ccMarketing' ? 'mkt' : 'version') + '&k=' + encodeURIComponent(args[0]), fn === 'ccMarketing' ? 40000 : 15000);
  req.then(function(res){ if (!res.ok) throw new Error('The server did not answer (' + res.status + '). Please try again in a moment.'); return res.json(); })
     .then(function(j){ if (j && j.error) fail(new Error(j.error)); else ok(j.result); })
     .catch(function(e){ if (e && e.name === 'AbortError') { var t = new Error('Google is taking too long to answer.'); t.timeout = true; return fail(t); }
       fail(new Error(/fetch|network|load failed/i.test(String(e && e.message)) ? 'Could not reach the server. Check your internet and try again.' : String((e && e.message) || e))); });
}
function fetchWithTimeout(url, ms){
  if (!window.AbortController) return fetch(url, { credentials:'omit', redirect:'follow' });
  var c = new AbortController(), t = setTimeout(function(){ c.abort(); }, ms);
  return fetch(url, { credentials:'omit', redirect:'follow', signal:c.signal }).then(function(r){ clearTimeout(t); return r; }, function(e){ clearTimeout(t); throw e; });
}
/* the last board this browser saw, so the page opens instantly while fresh data loads */
function cacheKey(){ return 'ep_board_' + (BOOT && BOOT.k || ''); }
function saveCopy(d){ try { localStorage.setItem(cacheKey(), JSON.stringify({ t: Date.now(), d: d })); } catch (e) {} }
function readCopy(){ try { var x = JSON.parse(localStorage.getItem(cacheKey()) || 'null'); return x && x.d && (Date.now() - x.t) < 7*864e5 ? x : null; } catch (e) { return null; } }
var CONNECTED = !!BOOT && (!!API || !!(window.google && google.script));
var S = { data:null, open:{}, q:'', filter:'all', confirm:'', view:'edit', bq:'', bfilter:'all', bmonth:'cur' };
try { var hv = location.hash==='#brides' ? 'brides' : location.hash==='#marketing' ? 'mkt' : '', lv = localStorage.getItem('ep_view'); S.view = hv || (lv==='brides'||lv==='mkt' ? lv : 'edit'); } catch (e) {}
/* 4 columns, left to right the way a wedding moves. "Your turn" = Rafael: pick up delivered videos and upload them to
   MediaZilla, and do revisions. Maga sends only what is already on MediaZilla. Closed weddings fold away under the board. */
var LANES = [['start','Coming up & footage'], ['editors','With editors'], ['mine','Your turn'], ['maga','Maga sends']];
/* each video sits in its own column, so one wedding can show in two or three columns at once */
function lanesOf(c){ return c.lanes||['start']; }
function onLane(c,l){ return lanesOf(c).indexOf(l)>=0; }
function laneName(l){ var a=S.data&&S.data.role==='Assistant'; return l==='mine'?(a?'With Rafael':'Your turn'):l==='maga'?(a?'Ready to send':'Maga sends'):LANES.filter(function(x){return x[0]===l;})[0][1]; }
var EDS = ['Betania','Sanjay','Gilberth'];
var SENDS = { teaser:['Teaser','Teaser sent to the couple'], hl:['Highlight','Highlight sent to the couple'], doc:['Documentary','Documentary sent to the couple'] };

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function toast(msg,bad){ var t=document.getElementById('toast'); t.textContent=msg; t.className=bad?'bad':''; t.style.display='block'; clearTimeout(toast.h); toast.h=setTimeout(function(){t.style.display='none';},msg.length>60?8000:4500); }
function todayIso(){ var p=S.data.today.split('/'); return p[2]+'-'+p[0]+'-'+p[1]; }
function busy(on){ document.getElementById('app').classList.toggle('loading',!!on); }

/* Opening the page: show the last saved copy at once (if this browser has one), then fetch fresh data.
   If Google is slow, try again by itself (3 times), and never sit on "Loading…" in silence. */
var loadTry=0;
function load(){
  var my=++loadTry, app=document.getElementById('app'), attempt=0;
  if(!S.data){ var copy=readCopy(); if(copy){ S.data=copy.d; S.version=''; S.stale=true; render();
    toast('Showing your board from '+new Date(copy.t).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})+' · updating…'); } }
  if(!S.stale) busy(true);
  var slow=setTimeout(function(){
    if(my!==loadTry || S.data) return;
    busy(false);
    app.innerHTML='<div class="warn-box">Still loading your weddings… Google is slow right now; the page keeps trying by itself. '+
      'You can wait, or <button class="btn" onclick="load()">Try again</button></div>';
  },20000);
  function go(){
    attempt++;
    server('ccLoad',[BOOT.k],function(d){
      if(my!==loadTry) return;
      clearTimeout(slow); var was=S.data, wasStale=S.stale;
      S.data=d; S.version=d.version; S.lastFull=Date.now(); S.stale=false; busy(false); saveCopy(d);
      if(wasStale){ var lanes=document.getElementById('lanes'), x=lanes?lanes.scrollLeft:0, y=window.scrollY; render(); lanes=document.getElementById('lanes'); if(lanes) lanes.scrollLeft=x; window.scrollTo(0,y); toast(changes(was,d)||'Up to date'); }
      else render();
    },function(e){
      if(my!==loadTry) return;
      if(e.timeout && attempt<3) return go();                 // Google was slow: ask again
      clearTimeout(slow); busy(false);
      if(S.data){ toast((S.stale?'Could not update the board: ':'')+(e.message||String(e)),true); return; }
      app.innerHTML='<div class="warn-box">'+esc(e.message||e)+' <button class="btn" onclick="load()">Try again</button></div>';
    });
  }
  go();
}

/* scroll bar on top of the columns, kept in step with the board */
function linkBars(){
  var lanes=document.getElementById('lanes'), track=document.getElementById('track'), thumb=document.getElementById('thumb'), box=document.getElementById('hscroll');
  if(!lanes||!track) return;
  var max=lanes.scrollWidth-lanes.clientWidth;
  box.classList.toggle('off', max<=2);
  if(max<=2) return;
  var tw=track.clientWidth, w=Math.max(40, tw*lanes.clientWidth/lanes.scrollWidth);
  thumb.style.width=w+'px';
  thumb.style.left=((tw-w)*lanes.scrollLeft/max)+'px';
  if(lanes.dataset.linked) return;
  lanes.dataset.linked='1';
  lanes.addEventListener('scroll',linkBars);
  var drag=null;
  thumb.addEventListener('pointerdown',function(e){ e.preventDefault(); e.stopPropagation(); drag={x:e.clientX,s:lanes.scrollLeft}; thumb.classList.add('drag'); thumb.setPointerCapture(e.pointerId); });
  thumb.addEventListener('pointermove',function(e){
    if(!drag) return; var m=lanes.scrollWidth-lanes.clientWidth, room=track.clientWidth-thumb.offsetWidth;
    if(room>0) lanes.scrollLeft=drag.s+(e.clientX-drag.x)*m/room;
  });
  var end=function(){ drag=null; thumb.classList.remove('drag'); };
  thumb.addEventListener('pointerup',end); thumb.addEventListener('pointercancel',end);
  track.addEventListener('pointerdown',function(e){   // click on the empty part of the bar: jump there
    if(e.target!==track) return;
    var r=track.getBoundingClientRect(), m=lanes.scrollWidth-lanes.clientWidth, w2=thumb.offsetWidth;
    var pos=Math.min(1,Math.max(0,(e.clientX-r.left-w2/2)/(r.width-w2)));
    lanes.scrollTo({left:pos*m,behavior:'smooth'});
  });
}
function slide(dir){
  var lanes=document.getElementById('lanes'); if(!lanes) return;

}

var BLANES=[['new','New inquiries','inquiries'],['call','Calls booked','calls'],['sent','Contracts sent','contracts'],['signed','Signed','signed'],['booked','Booked · deposit paid','booked'],['follow','Follow up','follow-ups']];
var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];

function inLane(x,l,m){ var a=x.lanes||[]; return a.indexOf(l+'@'+m)>=0 || ((l==='sent'||l==='signed') && a.indexOf(l+'@open')>=0); }
/* One small chart per parameter: last month (all of it) against this month so far.
   The thin white mark on last month's bar is where last month stood on the same day. */
function monthChart(l,st,M){
  var max=Math.max(st.prev,st.cur,1), x0=38, w=118, bw=function(n){ return n?Math.max(3,Math.round(w*n/max)):0; };
  var noun=BLANES.filter(function(b){return b[0]===l;})[0][2];
  var tipPrev=monthName(M.prev)+': '+st.prev+' '+noun+' ('+st.prevSame+' by '+monthName(M.prev,1)+' '+M.day+')';
  var tipCur=monthName(M.cur)+' so far: '+st.cur+' '+noun;
  var tick=x0+Math.round(w*st.prevSame/max);
  return '<svg class="mchart" viewBox="0 0 200 46" role="img" aria-label="'+esc(tipPrev+'. '+tipCur)+'">'+
    '<text x="0" y="15">'+monthName(M.prev,1)+'</text>'+
    '<rect x="'+x0+'" y="4" width="'+bw(st.prev)+'" height="13" rx="4" fill="#7D7168"><title>'+esc(tipPrev)+'</title></rect>'+
    (st.prevSame?'<rect x="'+(tick-1)+'" y="1" width="2" height="19" fill="#F5F2EC"><title>'+esc(st.prevSame+' by '+monthName(M.prev,1)+' '+M.day)+'</title></rect>':'')+
    '<text class="v" x="'+(x0+bw(st.prev)+6)+'" y="15">'+st.prev+'</text>'+
    '<text x="0" y="38">'+monthName(M.cur,1)+'</text>'+
    '<rect x="'+x0+'" y="27" width="'+bw(st.cur)+'" height="13" rx="4" fill="#E3D3BD"><title>'+esc(tipCur)+'</title></rect>'+
    '<text class="v" x="'+(x0+bw(st.cur)+6)+'" y="38">'+st.cur+'</text></svg>';
}

function renderBLanes(){

/* ---------------------------------------------------- live updates
   Every 20 s the page asks "did anything change?". If yes, it reloads quietly and says what moved.
   Every 5 min it reloads anyway, so new weddings from the master appear. Never while you are typing. */
var POLL_MS=20000, FULL_MS=300000, polling=false;
function userBusy(){
  var a=document.activeElement, t=a&&a.tagName;
  return M || S.confirm || t==='INPUT' || t==='TEXTAREA' || t==='SELECT' || document.getElementById('app').classList.contains('loading');
}
function changes(oldD,newD){
  var before={}, out=[], fresh=0;
  (oldD.cards||[]).forEach(function(c){ before[c.key]=c; });
  (newD.cards||[]).forEach(function(c){
    var o=before[c.key];
    if(!o){ fresh++; return; }
    if(!o.footage && c.footage) out.push('Footage in NAS for '+c.couple);
    if(c.inRevision && !o.inRevision) out.push(c.couple+': client asked for changes ('+c.revLabel+')');
    if(!c.inRevision && o.inRevision) out.push('Revision done for '+c.couple+' — ready to send');
    (c.videos||[]).forEach(function(v){
      var ov=(o.videos||[]).filter(function(x){return x.type===v.type;})[0];
      if(v.done && !(ov&&ov.done)) out.push(v.editor+' delivered the '+v.label+' for '+c.couple);
      else if(v.done && v.up && ov && ov.done && !ov.up) out.push(v.label+' for '+c.couple+' is on MediaZilla — ready to send');
      else if(ov && ov.editor!==v.editor) out.push(v.label+' for '+c.couple+' moved to '+v.editor);
    });
    (c.videos||[]).forEach(function(v){ var ov=(o.videos||[]).filter(function(x){return x.type===v.type;})[0]; if(v.sent && !(ov&&ov.sent)) out.push(v.label+' sent for '+c.couple); });
    if(c.closed && !o.closed) out.push(c.couple+' closed');
    if(!c.closed && o.closed) out.push(c.couple+' reopened');
  });
  if(fresh) out.push(fresh+(fresh===1?' new wedding':' new weddings')+' on the board');
  if(!out.length) return '';
  return 'Updated: '+out.slice(0,3).join(' · ')+(out.length>3?' · and '+(out.length-3)+' more':'');
}
function quietLoad(){
  if(userBusy()||polling) return;
  polling=true;
  server('ccLoad',[BOOT.k],function(d){
    polling=false;
    if(userBusy()) return;                       // you started typing meanwhile: try again next round
    var msg=changes(S.data,d), lanes=document.getElementById('lanes'), x=lanes?lanes.scrollLeft:0, y=window.scrollY;
    S.data=d; S.version=d.version; S.lastFull=Date.now(); S.stale=false; saveCopy(d); render();
    lanes=document.getElementById('lanes'); if(lanes) lanes.scrollLeft=x; window.scrollTo(0,y);
    if(msg) toast(msg);
  },function(){ polling=false; });
}
function poll(){
  if(!S.data || document.hidden || userBusy() || polling) return;
  if(Date.now()-(S.lastFull||0) > FULL_MS) return quietLoad();
  server('ccVersion',[BOOT.k],function(v){ if(v!==S.version) quietLoad(); },function(){});
}
if (CONNECTED) {
  setInterval(poll, POLL_MS);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) poll(); });
}

  for(var i=1;i<=12;i++){
    var m=yr+'-'+('0'+i).slice(-2); if(m>cur) break;
    var part=MK.m[m]&&MK.m[m].partial;
    h+='<tr'+(m===S.mm?' class="sel"':'')+'><td>'+monthName(m)+(part?' <span class="dim">(1–'+MK.day+')</span>':'')+'</td>';
    MKM.forEach(function(x){
      var a=mkV(m,x[0],part), b=mkV(mkLY(m),x[0],part), d=mkDelta(a,b,true);
      if(a!==null) ta[x[0]]+=a; if(b!==null) tb[x[0]]=(tb[x[0]]||0)+b;
      h+='<td><b>'+(a===null?'—':a)+'</b> <span class="dim">/ '+(b===null?'—':b)+'</span></td><td class="'+d.c+'">'+(b===null?'':d.t)+'</td>';
    });
    h+='</tr>';
  }
  h+='<tr class="sel"><td><b>Year so far</b></td>';
  MKM.forEach(function(x){ var d=mkDelta(ta[x[0]],tb[x[0]],true); h+='<td><b>'+ta[x[0]]+'</b> <span class="dim">/ '+(tb[x[0]]===null?'—':tb[x[0]])+'</span></td><td class="'+d.c+'">'+(tb[x[0]]===null?'':d.t)+'</td>'; });
  return h+'</tr></table></div>';
}

function renderMarketing(){
  var d=S.data, h='<header><div><h1>Marketing <span class="ver">alpha</span></h1><div class="sub">Only you see this · today '+esc(d.today)+(MK&&MK.updated?' · emails read '+esc(MK.updated):'')+' · updates by itself at 6 AM, 12 PM and 6 PM</div></div>'+
    '<div class="row" style="margin:0">'+viewSwitch()+'<button class="chip" onclick="MK=null;loadMkt();renderMarketing()">Refresh</button></div></header>';
  if(!MK){
    h+=MKERR?'<div class="warn-box">Marketing could not load: '+esc(MKERR)+' <button class="chip" onclick="loadMkt();renderMarketing()">Try again</button></div>':'<p class="sub">Loading the numbers…</p>';
    document.getElementById('app').innerHTML=h; if(!MKERR) loadMkt(); return;
  }
  var sel=S.mm, fair=mkFair(), p=mkPrev(sel), ly=mkLY(sel);
  h+='<div class="mk">';
  h+='<div class="ctl"><select onchange="S.mm=this.value;renderMarketing()" aria-label="Month">'+MK.months.slice().reverse().filter(function(m){return mkHas(m);}).map(function(m){ return '<option value="'+m+'"'+(m===sel?' selected':'')+'>'+mkName(m)+(MK.m[m].partial?' (so far)':'')+'</option>'; }).join('')+'</select>'+
     '<span class="sub">'+(fair?'Month in progress: every comparison uses day 1 to '+MK.day+' of that month, so it is fair.':'Whole months compared.')+'</span></div>';
  if(!(MK.history&&MK.history.rows)) h+='<div class="warn-box">Last year is still loading from your emails. The “last year” columns fill in by themselves when it finishes.</div>';
  h+='<div class="kpis">'+MKM.map(function(x){
    var a=mkV(sel,x[0],false);
    return '<div class="kpi" style="--c:var(--c-'+x[0]+')"><div class="k">'+x[1]+'</div><div class="v">'+a+'</div><div class="chips">'+
      mkChip(mkCmpName(p,1),mkV(sel,x[0],fair),mkV(p,x[0],fair))+mkChip(mkCmpName(ly,1),mkV(sel,x[0],fair),mkV(ly,x[0],fair))+'</div>'+mkSpark(x[0])+'</div>';
  }).join('')+'</div>';
  h+='<div class="grid2 wide"><section class="sec"><h2>The funnel · '+esc(mkName(sel))+'</h2><p class="lede">Solid = '+esc(monthName(sel))+(fair?' so far':'')+'. Dashed outline = '+esc(mkCmpName(ly))+'.</p>'+mkFunnel()+'</section>'+
     '<section class="sec"><h2>This month against the others</h2><p class="lede">Green = better, red = worse. “Per 100 inquiries” compares what happened in the same month.</p>'+mkCompareTable()+'</section></div>';
  h+='<section class="sec"><h2>'+esc((MKM.filter(function(x){return x[0]===(S.mmet||'new');})[0]||MKM[0])[1])+' by month · '+sel.slice(0,4)+' against '+(+sel.slice(0,4)-1)+'</h2>'+
     '<div class="legend"><span><i style="background:var(--c-'+(S.mmet||'new')+')"></i>'+sel.slice(0,4)+'</span><span><i style="background:var(--c-'+(S.mmet||'new')+');opacity:.32"></i>'+(+sel.slice(0,4)-1)+'</span><span>Dashed bar = month in progress</span></div>'+
     '<div class="ctl" style="margin-bottom:8px">'+MKM.map(function(x){ return '<button class="chip'+((S.mmet||'new')===x[0]?' on':'')+'" onclick="S.mmet=\''+x[0]+'\';renderMarketing()">'+x[1]+'</button>'; }).join('')+'</div>'+mkTrend()+'</section>';
  var src=mkSources();
  h+='<section class="sec"><h2>Where inquiries come from · '+esc(mkName(sel))+'</h2><p class="lede">From “How did you hear about us?” on the inquiry form. Blue = inquiries, green line = booked, dashed outline = same month last year.</p>'+
     (src.empty?'<p class="sub">No inquiries with a source this month yet.</p>':'<div class="grid2"><div>'+src.chart+'</div><div>'+src.table+'</div></div>')+'</section>';
  h+='<section class="sec"><h2>Month by month · '+sel.slice(0,4)+' / '+(+sel.slice(0,4)-1)+'</h2><p class="lede">Each cell: this year / the same month last year, then the change.</p>'+mkYearTable()+'</section>';
  h+='<p class="note">How it is counted: Inquiries = website forms plus consultation calls booked without a form · Calls = Calendly consultation calls · Contracts = first contract emailed · Signed = Dubsado signature · Booked = deposit paid (the Sales Board date wins). Each one counts in the month it happened. Test entries and rows marked IGNORE are left out. '+
     (MK.history&&MK.history.rows?'Last year: '+MK.history.rows+' brides from your emails, October 2024 to December 2025.':'')+'</p>';
  h+='</div>';
  document.getElementById('app').innerHTML=h;
}

function render(){ if(!S.data) return; if(S.data.role==='Rafael'||S.data.role==='Assistant'){ if(S.view==='mkt'&&S.data.role==='Rafael') renderMarketing(); else if(S.view==='brides'&&S.data.pipeline) renderBrides(); else renderBoard(); } else renderEditor(); }
if (CONNECTED) load();
else document.getElementById('app').innerHTML='<div class="warn-box">This page needs your private link. Ask Rafael for it.</div>';
</script>
</body>
</html>
